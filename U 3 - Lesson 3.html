.[cite: 2]</td>\n<td style=\"text-align:left\">&#x623;&#x648;&#x631;&#x627;&#x642; &#x627;&#x644;&#x623;&#x646;&#x645;&#x627;&#x637; &#x627;&#x644;&#x645;&#x62a;&#x62a;&#x627;&#x644;&#x64a;&#x629; (&#x627;&#x644;&#x645;&#x638;&#x647;&#x631;)</td>\n<td style=\"text-align:left\">The paint and clothes of the website.[cite: 2]</td>\n</tr>\n<tr data-lines=\"38,39\">\n<td style=\"text-align:left\"><strong>JavaScript</strong></td>\n<td style=\"text-align:left\">Adds behavior and interactivity.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62c;&#x627;&#x641;&#x627; &#x633;&#x643;&#x631;&#x64a;&#x628;&#x62a; (&#x627;&#x644;&#x633;&#x644;&#x648;&#x643;)</td>\n<td style=\"text-align:left\">The muscles that make the website move and react.[cite: 2]</td>\n</tr>\n<tr data-lines=\"39,40\">\n<td style=\"text-align:left\"><strong>Semantic HTML</strong></td>\n<td style=\"text-align:left\">Using tags that indicate their meaning (like <code>&lt;header&gt;</code>).[cite: 2]</td>\n<td style=\"text-align:left\">HTML &#x627;&#x644;&#x62f;&#x644;&#x627;&#x644;&#x64a;</td>\n<td style=\"text-align:left\">Using meaningful code so computers understand the page.[cite: 2]</td>\n</tr>\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>Responsive design</strong></td>\n<td style=\"text-align:left\">Layout adjusts automatically to screen sizes.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645; &#x627;&#x644;&#x645;&#x62a;&#x62c;&#x627;&#x648;&#x628;</td>\n<td style=\"text-align:left\">The website looks good on a PC, tablet, AND phone.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Framework</strong></td>\n<td style=\"text-align:left\">Ready-made functions for efficient development.[cite: 2]</td>\n<td style=\"text-align:left\">&#x625;&#x637;&#x627;&#x631; &#x627;&#x644;&#x639;&#x645;&#x644;</td>\n<td style=\"text-align:left\">A pre-built toolset so coders save time.[cite: 2]</td>\n</tr>\n</tbody>\n</t
