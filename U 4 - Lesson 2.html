t-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"40,47\">\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>Persona</strong></td>\n<td style=\"text-align:left\">A typical user pictured as a concrete person.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x634;&#x62e;&#x635;&#x64a;&#x629; &#x627;&#x644;&#x627;&#x641;&#x62a;&#x631;&#x627;&#x636;&#x64a;&#x629; &#x644;&#x644;&#x639;&#x645;&#x64a;&#x644;</td>\n<td style=\"text-align:left\">Inventing a fake person to represent your real users.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Wireframe</strong></td>\n<td style=\"text-align:left\">A layout blueprint before any color or decoration.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x625;&#x637;&#x627;&#x631; &#x627;&#x644;&#x633;&#x644;&#x643;&#x64a; (&#x627;&#x644;&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x645;&#x628;&#x62f;&#x626;&#x64a;)</td>\n<td style=\"text-align:left\">A simple sketch showing where text and images will go.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>Contrast</strong></td>\n<td style=\"text-align:left\">Make important things stand out.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x628;&#x627;&#x64a;&#x646;</td>\n<td style=\"text-align:left\">Using bold text or bright colors to highlight things.[cite: 2]</td>\n</tr>\n<tr data-lines=\"43,44\">\n<td style=\"text-align:left\"><strong>Repetition</strong></td>\n<td style=\"text-align:left\">Reuse styles for consistency.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x643;&#x631;&#x627;&#x631;</td>\n<td style=\"text-align:left\">Using the same fonts and colors on every page.[cite: 2]</td>\n</tr>\n<tr data-lines=\"44,45\">\n<td style=\"text-align:left\"><strong>Alignment</strong></td>\n<td style=\"text-align:left\">Align elements to a common baseline.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x645;&#x62d;&#x627;&#x630;&#x627;&#x629;</td>\n<td style=\"text-align:left\">Making sure text and boxes line up neatly.[cite: 2]</td>\n</tr>\n<tr data-lines=\"45,46\">\n<td style=\"text-align:left\"><strong>Proximity</strong></td>\n<td style=\"text-align:left\">Group related items together.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x642;&#x627;&#x631;&#x628;</td>\n<td style=\"text-align:left\">Putting things that belong together close to each other.[cite: 2]</td>\n</tr>\n<tr data-lines=\"46,47\">\n<td style=\"text-align:left\"><strong>User-Centered Design (UCD)</strong></td>\n<td style=\"text-align:left\">Designing from the user&apos;s perspective.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645; &#x627;&#x644;&#x645;&#x62a;&#x645;&#x62d;&#x648;&#x631; &#x62d;&#x648;&#x644; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;</td>\n<td style=\"text-align:left\">Making choices based on what the user wants, not the creator.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"38,47"}}],"payload":{"tag":"h2","lines":"36,37"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: Persona and Wireframe (&#x627;&#x644;&#x634;&#x62e;&#x635;&#x64a;&#x629; &#x627;&#x644;&#x627;&#x641;&#x62a;&#x631;&#x627;&#x636;&#x64a;&#x629; &#x648;&#x627;&#x644;&#x625;&#x637;&#x627;&#x631; &#x627;&#x644;&#x633;&#x644;&#x643;&#x64a;)","children":[],"payload":{"tag":"h3","lines":"52,53"}},{"content":"Main Topic 2: The Four Principles of Design (&#x645;&#x628;&#x627;&#x62f;&#x626; &#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645; &#x627;&#x644;&#x623;&#x631;&#x628;&#x639;&#x629; - CRAP)","children":[{"content":"1. <strong>Contrast (&#x627;&#x644;&#x62a;&#x628;&#x627;&#x64a;&#x646;):</strong> Make the priority of information clear (e.g., Make headings large and bold).[cite: 2]<br>\n&#x627;&#x62c;&#x639;&#x644; &#x623;&#x648;&#x644;&#x648;&#x64a;&#x629; &#x627;&#x644;&#x645;&#x639;&#x644;&#x648;&#x645;&#x627;&#x62a; &#x648;&#x627;&#x636;&#x62d;&#x629; (&#x645;&#x62b;&#x644;: &#x627;&#x62c;&#x639;&#x644; &#x627;&#x644;&#x639;&#x646;&#x627;&#x648;&#x64a;&#x646; &#x643;&#x628;&#x64a;&#x631;&#x629; &#x648;&#x639;&#x631;&#x64a;&#x636;&#x629;).","children":[],"payload":{"tag":"li","lines":"68,70","listIndex":1}},{"content":"2. <strong>Repetition (&#x627;&#x644;&#x62a;&#x643;&#x631;&#x627;&#x631;):</strong> Repeat specific characteristics for consistency (e.g., Standardize font and colors on each page).[cite: 2]<br>\n&#x643;&#x631;&#x631; &#x62e;&#x635;&#x627;&#x626;&#x635; &#x645;&#x639;&#x64a;&#x646;&#x629; &#x644;&#x62a;&#x62d;&#x642;&#x64a;&#x642; &#x627;&#x644;&#x627;&#x62a;&#x633;&#x627;&#x642; (&#x645;&#x62b;&#x644;: &#x62a;&#x648;&#x62d;&#x64a;&#x62f; &#x627;&#x644;&#x62e;&#x637; &#x648;&#x627;&#x644;&#x623;&#x644;&#x648;&#x627;&#x646; &#x641;&#x64a; &#x643;&#x644; &#x635;&#x641;&#x62d;&#x629;).","children":[],"payload":{"tag":"li","lines":"70,72","listIndex":2}},{"content":"3. <strong>Alignment (&#x627;&#x644;&#x645;&#x62d;&#x627;&#x630;&#x627;&#x629;):</strong> Align the position of each element to give order (e.g., Align the left edges of text).[cite: 2]<br>\n&#x642;&#x645; &#x628;&#x645;&#x62d;&#x627;&#x630;&#x627;&#x629; &#x645;&#x648;&#x636;&#x639; &#x643;&#x644; &#x639;&#x646;&#x635;&#x631; &#x644;&#x625;&#x639;&#x637;&#x627;&#x621; &#x646;&#x638;&#x627;&#x645; (&#x645;&#x62b;&#x644;: &#x645;&#x62d;&#x627;&#x630;&#x627;&#x629; &#x627;&#x644;&#x62d;&#x648;&#x627;&#x641; &#x627;&#x644;&#x64a;&#x633;&#x631;&#x649; &#x644;&#x644;&#x646;&#x635;).","children":[],"payload":{"tag":"li","lines":"72,74","listIndex":3}},{"content":"4. <strong>Proximity (&#x627;&#x644;&#x62a;&#x642;&#x627;&#x631;&#x628;):</strong> Place related information close together as a single group (e.g., Group product images, name ></td>\n<td style=\"text-align:left\">Highlight priority.</td>\n<td style=\"text-align:left\">Big red &quot;BUY&quot; button.</td>\n</tr>\n<tr data-lines=\"99,100\">\n<td style=\"text-align:left\"><strong>Repetition</strong></td>\n<td style=\"text-align:left\">Consistency.</td>\n<td style=\"text-align:left\">Same logo position on every page.</td>\n</tr>\n<tr data-lines=\"100,101\">\n<td style=\"text-align:left\"><strong>Alignment</strong></td>\n<td style=\"text-align:left\">Organized look.</td>\n<td style=\"text-align:left\">Text lines up on the left side.</td>\n</tr>\n<tr data-lines=\"101,102\">\n<td style=\"text-align:left\"><strong>Proximity</strong></td>\n<td style=\"text-align:left\">Grouping.</td>\n<td style=\"text-align:left\">Picture of a shoe is right next to its price.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"96,102"}}],"payload":{"tag":"h2","lines":"94,95"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image:</strong> A simple wireframe drawing showing grey boxes labeled &quot;Header&quot;, &quot;Navigation&quot;, &quot;Main Content&quot;, and &quot;Sidebar&quot; with no real colors or pictures.[cite: 2]","children":[{"content":"<em>Search Keywords:</em> &quot;Website wireframe layout sketch&quot;","children":[],"payload":{"tag":"li","lines":"108,110"}}],"payload":{"tag":"li","lines":"107,110"}}],"payload":{"tag":"h2","lines":"105,106"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f535; Persona: Imaginary typical user (Age, job, needs).[cite: 2]","children":[],"payload":{"tag":"li","lines":"118,119"}},{"content":"&#x1f535; Wireframe: Rough blueprint (No colors, sets layout).[cite: 2]","children":
