strong>&#x634;&#x631;&#x62d;</strong> &#x643;&#x64a;&#x641;&#x64a;&#x629; &#x62a;&#x645;&#x648;&#x636;&#x639; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x627;&#x644;&#x62a;&#x648;&#x644;&#x64a;&#x62f;&#x64a; &#x62f;&#x627;&#x62e;&#x644; &#x62a;&#x642;&#x646;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;.","children":[],"payload":{"tag":"li","lines":"31,33"}},{"content":"<strong>Distinguish</strong> between Machine Learning, Deep Learning, and Generative AI.[cite: 2]<br>\n<strong>&#x627;&#x644;&#x62a;&#x645;&#x64a;&#x64a;&#x632;</strong> &#x628;&#x64a;&#x646; &#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x622;&#x644;&#x629;&#x60c; &#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x639;&#x645;&#x64a;&#x642;&#x60c; &#x648;&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x627;&#x644;&#x62a;&#x648;&#x644;&#x64a;&#x62f;&#x64a;.","children":[],"payload":{"tag":"li","lines":"33,35"}},{"content":"<strong>Describe</strong> how a neural network functions based on the human brain.[cite: 2]<br>\n<strong>&#x648;&#x635;&#x641;</strong> &#x643;&#x64a;&#x641; &#x62a;&#x639;&#x645;&#x644; &#x627;&#x644;&#x634;&#x628;&#x643;&#x629; &#x627;&#x644;&#x639;&#x635;&#x628;&#x64a;&#x629; &#x628;&#x646;&#x627;&#x621;&#x64b; &#x639;&#x644;&#x649; &#x627;&#x644;&#x62f;&#x645;&#x627;&#x63a; &#x627;&#x644;&#x628;&#x634;&#x631;&#x64a;.","children":[],"payload":{"tag":"li","lines":"35,38"}}],"payload":{"tag":"h2","lines":"24,25"}},{"content":"3. KEY VOCABULARY (&#x627;&#x644;&#x645;&#x635;&#x637;&#x644;&#x62d;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629;)","children":[{"content":"<table data-lines=\"42,50\">\n<thead data-lines=\"42,43\">\n<tr data-lines=\"42,43\">\n<th style=\"text-align:left\">English Term</th>\n<th style=\"text-align:left\">Simple English Meaning</th>\n<th style=\"text-align:left\">Arabic Meaning</th>\n<th style=\"text-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"44,50\">\n<tr data-lines=\"44,45\">\n<td style=\"text-align:left\"><strong>AI (Artificial Intelligence)</strong></td>\n<td style=\"text-align:left\">Technologies that reproduce human intelligent behavior.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;</td>\n<td style=\"text-align:left\">When a computer acts smart like a human.[cite: 2]</td>\n</tr>\n<tr data-lines=\"45,46\">\n<td style=\"text-align:left\"><strong>Machine Learning</strong></td>\n<td style=\"text-align:left\">Learning patterns from data to make predictions.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x622;&#x644;&#x629;</td>\n<td style=\"text-align:left\">The computer learns by looking at examples, not fixed rules.[cite: 2]</td>\n</tr>\n<tr data-lines=\"46,47\">\n<td style=\"text-align:left\"><strong>Deep Learning</strong></td>\n<td style=\"text-align:left\">Using neural networks to learn complex patterns from large data.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x639;&#x645;&#x64a;&#x642;</td>\n<td style=\"text-align:left\">A deeper, smarter type of machine learning that needs massive data.[cite: 2]</td>\n</tr>\n<tr data-lines=\"47,48\">\n<td style=\"text-align:left\"><strong>Neural Network</strong></td>\n<td style=\"text-align:left\">A system modeled after the nerve cells of the human brain.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x634;&#x628;&#x643;&#x629; &#x627;&#x644;&#x639;&#x635;&#x628;&#x64a;&#x629;</td>\n<td style=\"text-align:left\">Computer code designed to work like connected brain cells.[cite: 2]</td>\n</tr>\n<tr data-lines=\"48,49\">\n<td style=\"text-align:left\"><strong>Generative AI</strong></td>\n<td style=\"text-align:left\">AI that uses deep learning to generate new text, images, or audio.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x627;&#x644;&#x62a;&#x648;&#x644;&#x64a;&#x62f;&#x64a;</td>\n<td style=\"text-align:left\">AI that <em>creates</em> brand new things (like ChatGPT).[cite: 2]</td>\n</tr>\n<tr data-lines=\"49,50\">\n<td style=\"text-align:left\"><strong>Hallucination</strong></td>\n<td style=\"text-align:left\">When generative AI produces text that sounds plausible but is factually incorrect.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x647;&#x644;&#x648;&#x633;&#x629; (&#x641;&#x64a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;)</td>\n<td style=\"text-align:left\">When the AI confidently gives you a wrong or fake answer.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"42,50"}}],"payload":{"tag":"h2","lines":"40,41"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: What is Artificial Intelligence? (&#x645;&#x627; &#x647;&#x648; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;&#x61f;)","children":[],"payload":{"tag":"h3","lines":"55,56"}},{"content":"Main Topic 2: The Hierarchy of AI Technologies (&#x627;&#x644;&#x62a;&#x633;&#x644;&#x633;&#x644; &#x627;&#x644;&#x647;&#x631;&#x645;&#x64a; &#x644;&#x62a;&#x642;&#x646;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;)","children":[],"payload":{"tag":"h3","lines":"65,66"}},{"content":"Main Topic 3: Machine Learning &amp; Deep Learning (&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x622;&#x644;&#x629; &#x648;&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x639;&#x645;&#x64a;&#x642;)","children":[],"payload":{"tag":"h3","lines":"75,76"}},{"content":"Main Topic 4: Generative AI (&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x627;&#x644;&#x62a;&#x648;&#x644;&#x64a;&#x62f;&#x64a;)","children":[],"payload":{"tag":"h3","lines":"92,93"}}],"payload":{"tag":"h2","lines":"53,54"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: The Hierarchy of AI (&#x627;&#x644;&#x62a;&#x633;&#x644;&#x633;&#x644; &#x627;&#x644;&#x647;&#x631;&#x645;&#x64a; &#x644;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;)","children":[],"payload":{"tag":"h3","lines":"104,105"}},{"content":"Difficult Concept: Hallucination in AI (&#x627;&#x644;&#x647;&#x644;&#x648;&#x633;&#x629; &#x641;&#x64a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;)","children":[],"payload":{"tag":"h3","lines":"110,111"}}],"payload":{"tag":"h2","lines":"102,103"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"120,125\">\n<thead data-lines=\"120,121\">\n<tr data-lines=\"120,121\">\n<th style=\"text-align:left\">Feature</th>\n<th style=\"text-align:left\">Fixed Rules (Traditional Programming)</th>\n<th style=\"text-align:left\">Machine Learning[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"122,125\">\n<tr data-lines=\"122,123\">\n<td style=\"text-align:left\"><strong>Meaning</strong></td>\n<td style=\"text-align:left\">A human writes exact step-by-step code.</td>\n<td style=\"text-align:left\">The computer learns rules from examples and data.[cite: 2]</td>\n</tr>\n<tr data-lines=\"123,124\">\n<td style=\"text-align:left\"><strong>How it works</strong></td>\n<td style=\"text-align:left\">&quot;If A happens, do B.&quot;</td>\n<td style=\"text-align:left\">Finds hidden patterns in large data to predict B.[cite: 2]</td>\n</tr>\n<tr data-lines=\"124,125\">\n<td style=\"text-align:left\"><strong>Example</strong></td>\n<td style=\"text-align:left\">A calculator.</td>\n<td style=\"text-align:left\">A spam filter analyzing thousands of emails.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"120,125"}}],"payload":{"tag":"h2","lines":"118,119"}},{"content":"7. IMPORTANT NOTES &amp; WARNINGS (&#x645;&#x644;&#x627;&#x62d;&#x638;&#x627;&#x62a; &#x648;&#x62a;&#x62d;&#x630;&#x64a;&#x631;&#x627;&#x62a; &#x647;&#x627;&#x645;&#x629;)","children":[{"content":"","children":[{"content":"Generative AI is just <em>one specific type</em> of AI, not the only type.[cite: 2]","children":[],"payload":{"tag":"li","lines":"134,135"}},{"content":"Deep learning <em>requires</em> large-scale data to learn properly. If it hasn&apos;t seen something in its data, it will struggle.[cite: 2]","children":[],"payload":{"tag":"li","lines":"135,137"}}],"payload":{"tag":"ul","lines":"134,137"}},{"content":"","children":[{"content":"&#x26a0;&#xfe0f; <strong>Wrong Idea:</strong> AI and Machine Learning have the exact same meaning.","children":[],"payload":{"tag":"li","lines":"138,139"}},{"content":"&#x2705; <strong>Correct Idea:</strong> AI is the broad concept, and Machine Learning is just one of the technologies inside it.[cite: 2]<br>\n&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x647;&#x648; &#x627;&#x644;&#x645;&#x641;&#x647;&#x648;&#x645; &#x627;&#x644;&#x648;&#x627;&#x633;&#x639;&#x60c; &#x648;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x622;&#x644;&#x629; &#x647;&#x648; &#x645;&#x62c;&#x631;&#x62f; &#x648;&#x627;&#x62d;&#x62f;&#x629; &#x645;&#x646; &#x627;&#x644;&#x62a;&#x642;&#x646;&#x64a;&#x627;&#x62a; &#x628;&#x62f;&#x627;&#x62e;&#x644;&#x647;.","children":[],"payload":{"tag":"li","lines":"139,142"}}],"payload":{"tag":"ul","lines":"138,142"}}],"payload":{"tag":"h2","lines":"131,132"}},{"content":"8. REAL-WORLD APPLICATIONS (&#x627;&#x644;&#x62a;&#x637;&#x628;&#x64a;&#x642;&#x627;&#x62a; &#x641;&#x64a; &#x627;&#x644;&#x62d;&#x64a;&#x627;&#x629; &#x627;&#x644;&#x648;&#x627;&#x642;&#x639;&#x64a;&#x629;)","children":[{"content":"<strong>Machine Learning:</strong> Sorting spam emails out of your inbox, or Amazon recommending a product you might like.[cite: 2]","children":[],"payload":{"tag":"li","lines":"147,148"}},{"content":"<strong>Deep Learning:</strong> Analyzing images for a self-driving car to recognize pedestrians on the road.[cite: 2]","children":[],"payload":{"tag":"li","lines":"148,149"}},{"content":"<strong>Generative AI:</strong> Using ChatGPT to write an essay, or Midjourney to create a new picture.[cite: 2]","children":[],"payload":{"tag":"li","lines":"149,151"}}],"payload":{"tag":"h2","lines":"144,145"}},{"content":"9. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image 1:</strong> A diagram of nested boxes or circles. The largest circle is labeled &quot;AI&quot;, inside it is &quot;Machine Learning&quot;, inside that is &quot;Deep Learning&quot;, and the innermost is &quot;Generative AI&quot;.[cite: 2]","children":[{"content":"<em>Why useful?</em> Visually explains the nested hierarchy concept clearly.","children":[],"payload":{"tag":"li","lines":"156,157"}},{"content":"<em>Search Keywords:</em> &quot;AI machine learning deep learning generative AI nested diagram&quot;","children":[],"payload":{"tag":"li","lines":"157,158"}}],"payload":{"tag":"li","lines":"155,158"}},{"content":"<strong>Suggested Image 2:</strong> A diagram of a Neural Network showing an Input Layer, Hidden Layers (connected by many lines), and an Output Layer.[cite: 2]","children":[{"content":"<em>Why useful?</em> Shows how simple parts connect in layers to make complex decisions.[cite: 2]","children":[],"payload":{"tag":"li","lines":"159,160"}},{"content":"<em>Search Keywords:</em> &quot;Simple neural network diagram layers&quot;","children":[],"payload":{"tag":"li","lines":"160,162"}}],"payload":{"tag":"li","lines":"158,162"}}],"payload":{"tag":"h2","lines":"153,154"}},{"content":"10. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f535; Definition: Reproducing human intelligent behavior.[cite: 2]","children":[],"payload":{"tag":"li","lines":"170,171"}},{"content":"&#x1f7e2; Examples: Speech recognition, translation.[cite: 2]","children":[],"payload":{"tag":"li","lines":"171,172"}},{"content":"&#x26a0;&#xfe0f; Note: Today&apos;s AI is &quot;narrow&quot; (expert at one task).[cite: 2]","children":[],"payload":{"tag":"li","lines":"172,174"}}],"payload":{"tag":"ul","lines":"170,174"}},{"content":"","children":[{"content":"&#x1f535; Definition: Learns patterns from data (not fixed rules).[cite: 2]","children":[],"payload":{"tag":"li","lines":"175,176"}},{"content":"&#x1f7e2; Examples: Spam filters, product recommendations.[cite: 2]","children":[],"payload":{"tag":"li","lines":"176,178"}}],"payload":{"tag":"ul","lines":"175,178"}},{"content":"","children":[{"content":"&#x1f535; Definition: Uses Neural Networks on large-scale data.[cite: 2]","children":[],"payload":{"tag":"li","lines":"179,180"}},{"content":"&#x1f7e0; Neural Network: Modeled after human brain cells (neurons).[cite: 2]","children":[],"payload":{"tag":"li","lines":"180,181"}},{"content":"&#x1f7e2; Examples: Image analysis for self-driving cars.[cite: 2]","children":[],"payload":{"tag":"li","lines":"181,183"}}],"payload":{"tag":"ul","lines":"179,183"}},{"content":"","children":[{"content":"&#x1f535; Definition: Generates <em>new</em> data (text, image, audio).[cite: 2]","children":[],"payload":{"tag":"li","lines":"184,185"}},{"content":"&#x1f7e2; Examples: ChatGPT.[cite: 2]","children":[],"payload":{"tag":"li","lines":"185,186"}},{"content":"&#x26a0;&#xfe0f; Warning: Hallucinations (making up fake facts).[cite: 2]","children":[],"payload":{"tag":"li","lines":"186,188"}}],"payload":{"tag":"ul","lines":"184,188"}}],"payload":{"tag":"h2","lines":"164,165"}},{"content":"11. RELATIONSHIPS BETWEEN CONCEPTS (&#x627;&#x644;&#x639;&#x644;&#x627;&#x642;&#x627;&#x62a; &#x628;&#x64a;&#x646; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645;)","children":[{"content":"<strong>Broadest &#x2192; Narrowest:</strong> AI &#x27a1;&#xfe0f; Machine Learning &#x27a1;&#xfe0f; Deep Learning &#x27a1;&#xfe0f; Generative AI.[cite: 2]<br>\n(&#x627;&#x644;&#x623;&#x634;&#x645;&#x644; &#x625;&#x644;&#x649; &#x627;&#x644;&#x623;&#x62e;&#x635;: &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x27a1;&#xfe0f; &#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x622;&#x644;&#x629; &#x27a1;&#xfe0f; &#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x639;&#x645;&#x64a;&#x642; &#x27a1;&#xfe0f; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x62a;&#x648;&#x644;&#x64a;&#x62f;&#x64a;)","children":[],"payload":{"tag":"li","lines":"192,194"}},{"content":"<strong>Problem &#x2192; Solution:</strong> Large Data &#x27a1;&#xfe0f; Deep Learning Neural Networks &#x27a1;&#xfe0f; Complex Judgments.[cite: 2]<br>\n(&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x636;&#x62e;&#x645;&#x629; &#x27a1;&#xfe0f; &#x634;&#x628;&#x643;&#x627;&#x62a; &#x639;&#x635;&#x628;&#x64a;&#x629; &#x644;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x639;&#x645;&#x64a;&#x642; &#x27a1;&#xfe0f; &#x623;&#x62d;&#x643;&#x627;&#x645; &#x645;&#x639;&#x642;&#x62f;&#x629;).","children":[],"payload":{"tag":"li","lines":"194,197"}}],"payload":{"tag":"h2","lines":"190,191"}},{"content":"12. EXAM-FOCUSED SECTION (&#x642;&#x633;&#x645; &#x627;&#x644;&#x62a;&#x631;&#x643;&#x64a;&#x632; &#x639;&#x644;&#x649; &#x627;&#x644;&#x627;&#x645;&#x62a;&#x62d;&#x627;&#x646;)","children":[{"content":"","children":[{"content":"The exact order of the nested categories: <strong>AI &gt; Machine Learning &gt; Deep Learning &gt; Generative AI</strong>.[cite: 2]","children":[],"payload":{"tag":"li","lines":"202,203"}},{"content":"<strong>Machine Learning</strong> learns from <em>patterns in data</em>, not from fixed written rules.[cite: 2]","children":[],"payload":{"tag":"li","lines":"203,204"}},{"content":"<strong>Neural Networks</strong> are inspired by the human brain and are the core of Deep Learning.[cite: 2]","children":[],"payload":{"tag":"li","lines":"204,205"}},{"content":"<strong>Generative AI</strong> is used to create <em>new</em> text or images.[cite: 2]","children":[],"payload":{"tag":"li","lines":"205,207"}}],"payload":{"tag":"ul","lines":"202,207"}},{"content":"","children":[{"content":"If it filters spam = Machine Learning.[cite: 2]","children":[],"payload":{"tag":"li","lines":"208,209"}},{"content":"If it uses a brain-like neural network = Deep Learning.[cite: 2]","children":[],"payload":{"tag":"li","lines":"209,210"}},{"content":"If it writes a new story for you = Generative AI.[cite: 2]","children":[],"payload":{"tag":"li","lines":"210,212"}}],"payload":{"tag":"ul","lines":"208,212"}}],"payload":{"tag":"h2","lines":"199,200"}},{"content":"13. QUESTIONS FOR SELF-ASSESSMENT (&#x623;&#x633;&#x626;&#x644;&#x629; &#x644;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x630;&#x627;&#x62a;&#x64a;)","children":[],"payload":{"tag":"h2","lines":"214,215"}},{"content":"14. FINAL MIND MAP SUMMARY (&#x62e;&#x644;&#x627;&#x635;&#x629; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[],"payload":{"tag":"h2","lines":"253,254"}}],"payload":{"t
