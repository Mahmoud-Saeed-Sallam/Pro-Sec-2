7;&#x635;&#x629;</td>\n<td style=\"text-align:left\">A safe, secret tunnel through the public internet.[cite: 2]</td>\n</tr>\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>DMZ</strong></td>\n<td style=\"text-align:left\">An area for public servers, separated from the internal network.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x645;&#x646;&#x637;&#x642;&#x629; &#x645;&#x646;&#x632;&#x648;&#x639;&#x629; &#x627;&#x644;&#x633;&#x644;&#x627;&#x62d;</td>\n<td style=\"text-align:left\">A waiting room for visitors so they don&apos;t enter the private house.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Defense in depth</strong></td>\n<td style=\"text-align:left\">Layering multiple security measures.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62f;&#x641;&#x627;&#x639; &#x628;&#x639;&#x645;&#x642; (&#x627;&#x644;&#x62f;&#x641;&#x627;&#x639; &#x645;&#x62a;&#x639;&#x62f;&#x62f; &#x627;&#x644;&#x637;&#x628;&#x642;&#x627;&#x62a;)</td>\n<td style=\"text-align:left\">Having a fence, a lock, AND a safe.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>Zero trust</strong></td>\n<td style=\"text-align:left\">Does not trust any access and always verifies it.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x646;&#x639;&#x62f;&#x627;&#x645; &#x627;&#x644;&#x62b;&#x642;&#x629;</td>\n<td style=\"text-align:left\">Trust nobody, not even computers inside the office.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"36,43"}}],"payload":{"tag":"h2","lines":"34,35"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: The Role of Firewalls and VPNs (&#x62f;&#x648;&#x631; &#x62c;&#x62f;&#x627;&#x631; &#x627;&#x644;&#x62d;&#x645;&#x627;&#x64a;&#x629; &#x648;&#x627;&#x644;&#x634;&#x628;&#x643;&#x627;&#x62a; &#x627;&#x644;&#x627;&#x641;&#x62a;&#x631;&#x627;&#x636;&#x64a;&#x629;)","children":[],"payload":{"tag":"h3","lines":"48,49"}},{"content":"Main Topic 2: DMZ (&#x627;&#x644;&#x645;&#x646;&#x637;&#x642;&#x629; &#x645;&#x646;&#x632;&#x648;&#x639;&#x629; &#x627;&#x644;&#x633;&#x644;&#x627;&#x62d;)","children":[],"payload":{"tag":"h3","lines":"56,57"}},{"content":"Main Topic 3: Defense in Depth (&#x627;&#x644;&#x62f;&#x641;&#x627;&#x639; &#x628;&#x639;&#x645;&#x642;)","children":[{"content":"<strong>Layer 1:</strong> Network entry (Firewall).[cite: 2]","children":[],"payload":{"tag":"li","lines":"67,68"}},{"content":"<strong>Layer 2:</strong> Communication path (VPN).[cite: 2]","children":[],"payload":{"tag":"li","lines":"68,69"}},{"content":"<strong>Layer 3:</strong> Server placement (DMZ).[cite: 2]","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"<strong>Layer 4:</strong> Endpoints (Antivirus software).[cite: 2]","children":[],"payload":{"tag":"li","lines":"70,72"}}],"payload":{"tag":"h3","lines":"62,63"}},{"content":"Main Topic 4: The Concept of Zero Trust (&#x645;&#x641;&#x647;&#x648;&#x645; &#x627;&#x646;&#x639;&#x62f;&#x627;&#x645; &#x627;&#x644;&#x62b;&#x642;&#x629;)","children":[],"payload":{"tag":"h3","lines":"72,73"}}],"payload":{"tag":"h2","lines":"46,47"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: Zero Trust vs. Traditional Security[cite: 2]","children":[],"payload":{"tag":"h3","lines":"84,85"}}],"payload":{"tag":"h2","lines":"82,83"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"93,98\">\n<thead data-lines=\"93,94\">\n<tr data-lines=\"93,94\">\n<th style=\"text-align:left\">Feature</th>\n<th style=\"text-align:left\">Traditional Security (&#x627;&#x644;&#x623;&#x645;&#x646; &#x627;&#x644;&#x62a;&#x642;&#x644;&#x64a;&#x62f;&#x64a;)[cite: 2]</th>\n<th style=\"text-align:left\">Zero Trust (&#x627;&#x646;&#x639;&#x62f;&#x627;&#x645; &#x627;&#x644;&#x62b;&#x642;&#x629;)[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"95,98\">\n<tr data-lines=\"95,96\">\n<td style=\"text-align:left\"><strong>Trust level</strong></td>\n<td style=\"text-align:left\">Trusts internal users completely.[cite: 2]</td>\n<td style=\"text-align:left\">Trusts nobody automatically.[cite: 2]</td>\n</tr>\n<tr data-lines=\"96,97\">\n<td style=\"text-align:left\"><strong>Boundary</strong></td>\n<td style=\"text-align:left\">Clear boundary (inside vs outside).[cite: 2]</td>\n<td style=\"text-align:left\">No internal/external boundary.[cite: 2]</td>\n</tr>\n<tr data-lines=\"97,98\">\n<td style=\"text-align:left\"><strong>Verification</strong></td>\n<td style=\"text-align:left\">Verified only at the firewall.[cite: 2]</td>\n<td style=\"text-align:left\">Verify EVERY access (app, data).[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"93,98"}}],"payload":{"tag":"h2","lines":"91,92"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image:</strong> A diagram showing Defense in Depth layers: An outer wall (Firewall), an isolated room outside the safe (DMZ for Web Server), and a safe inside (Database in Internal Network).[cite: 2]","children":[{"content":"<em>Search Keywords:</em> &quot;DMZ network configuration diagram defense in depth&quot;","children":[],"payload":{"tag":"li","lines":"104,106"}}],"payload":{"tag":"li","lines":"103,106"}}],"payload":{"tag":"h2","lines":"101,102"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f7e2; Firewall: Blocks/Allows by rules (Network entry).[cite: 2]","children":[],"payload":{"tag":"li","lines":"114,115"}},{"content":"&#x1f7e2; VPN: Encrypted tunnel for remote work.[cite: 2]","children":[],"payload":{"tag":"li","lines":"115,116"}},{"content":"&#x1f7e2; DMZ: Isolates public servers from internal data.[cite: 2]","children":[],"payload":{"tag":"li","lines":"116,118"}}],"payload":{"tag":"ul","lines":"114,118"}},{"content":"","children":[{"content":"&#x1f535; Concept: Layering multiple security measures.[cite: 2]","children":[],"payload":{"tag":"li","lines":"119,120"}},{"content":"&#x2b50; Why? If one fails, the next layer protects.[cite: 2]","children":[],"payload":{"tag":"li","lines":"120,122"}}],"payload":{"tag":"ul","lines":"119,122"}},{"content":"","children":[{"content":"&#x1f535; Concept: Never trust, always verify.[cite: 2]","children":[],"payload":{"tag":"li","lines":"123,124"}},{"content":"&#x26a0;&#xfe0f; Why? Remote work and cloud blurred the old perimeter.[cite: 2]","children":[],"payload":{"tag":"li","lines":"124,126"}}],"payload":{"tag":"ul","lines":"123,126"}}],"payload":{"tag":"h2","lines":"108,109"}},{"content":"9. EXAM-FOCUSED SECTION (&#x642;&#x633;&#x645; &#x627;&#x644;&#x62a;&#x631;&#x643;&#x64a;&#x632; &#x639;&#x644;&#x649; &#x627;&#x644;&#x627;&#x645;&#x62a;&#x62d;&#x627;&#x646;)","children":[{"content":"A <strong>DMZ</strong> protects the <em>internal network</em> by keeping the public-facing servers separated.[cite: 2]","children":[],"payload":{"tag":"li","lines":"131,132"}},{"content":"<strong>Defense in depth</strong> relies on layering (Firewall + VPN + DMZ + Antivirus), not just one strong wall.[cite: 2]","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"<strong>Zero trust</strong> means verifying every access because the traditional boundary (&quot;inside is safe&quot;) is no longer enough due to cloud computing and remote work.[cite: 2]","children":[],"payload":{"tag
