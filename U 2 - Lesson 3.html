2d;&#x644; &#x627;&#x644;&#x627;&#x633;&#x62a;&#x62c;&#x627;&#x628;&#x629; &#x627;&#x644;&#x633;&#x62a; &#x628;&#x627;&#x644;&#x62a;&#x631;&#x62a;&#x64a;&#x628; &#x627;&#x644;&#x635;&#x62d;&#x64a;&#x62d;.","children":[],"payload":{"tag":"li","lines":"27,29"}},{"content":"<strong>Apply</strong> the idea of risk assessment by prioritizing risks according to their impact and likelihood.[cite: 2]<br>\n<strong>&#x62a;&#x637;&#x628;&#x64a;&#x642;</strong> &#x641;&#x643;&#x631;&#x629; &#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x645;&#x62e;&#x627;&#x637;&#x631; &#x645;&#x646; &#x62e;&#x644;&#x627;&#x644; &#x62a;&#x62d;&#x62f;&#x64a;&#x62f; &#x623;&#x648;&#x644;&#x648;&#x64a;&#x627;&#x62a;&#x647;&#x627; &#x648;&#x641;&#x642;&#x627;&#x64b; &#x644;&#x62a;&#x623;&#x62b;&#x64a;&#x631;&#x647;&#x627; &#x648;&#x627;&#x62d;&#x62a;&#x645;&#x627;&#x644;&#x64a;&#x62a;&#x647;&#x627;.","children":[],"payload":{"tag":"li","lines":"29,32"}}],"payload":{"tag":"h2","lines":"22,23"}},{"content":"3. KEY VOCABULARY (&#x627;&#x644;&#x645;&#x635;&#x637;&#x644;&#x62d;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629;)","children":[{"content":"<table data-lines=\"36,44\">\n<thead data-lines=\"36,37\">\n<tr data-lines=\"36,37\">\n<th style=\"text-align:left\">English Term</th>\n<th style=\"text-align:left\">Simple English Meaning</th>\n<th style=\"text-align:left\">Arabic Meaning</th>\n<th style=\"text-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"38,44\">\n<tr data-lines=\"38,39\">\n<td style=\"text-align:left\"><strong>Security incident</strong></td>\n<td style=\"text-align:left\">Actual damage caused by a security problem.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62d;&#x627;&#x62f;&#x62b; &#x623;&#x645;&#x646;&#x64a;</td>\n<td style=\"text-align:left\">When a cyber attack actually succeeds and causes harm.[cite: 2]</td>\n</tr>\n<tr data-lines=\"39,40\">\n<td style=\"text-align:left\"><strong>Containment</strong></td>\n<td style=\"text-align:left\">Limit the scope of impact (stop the bleeding).[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x627;&#x62d;&#x62a;&#x648;&#x627;&#x621;</td>\n<td style=\"text-align:left\">Disconnecting a hacked PC so the virus doesn&apos;t spread.[cite: 2]</td>\n</tr>\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>Eradication</strong></td>\n<td style=\"text-align:left\">Remove the cause of the incident.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x627;&#x633;&#x62a;&#x626;&#x635;&#x627;&#x644; (&#x627;&#x644;&#x642;&#x636;&#x627;&#x621; &#x639;&#x644;&#x649; &#x627;&#x644;&#x633;&#x628;&#x628;)</td>\n<td style=\"text-align:left\">Deleting the virus/malware from the system.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Risk</strong></td>\n<td style=\"text-align:left\">The possibility of a problem occurring, and its impact.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62e;&#x637;&#x631;</td>\n<td style=\"text-align:left\">The chance something bad happens and how bad it will be.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>Impact</strong></td>\n<td style=\"text-align:left\">How much damage occurs if the risk materializes.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x623;&#x62b;&#x64a;&#x631;</td>\n<td style=\"text-align:left\">How bad is the damage?[cite: 2]</td>\n</tr>\n<tr data-lines=\"43,44\">\n<td style=\"text-align:left\"><strong>Likelihood</strong></td>\n<td style=\"text-align:left\">The probability that the risk will materialize.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x627;&#x62d;&#x62a;&#x645;&#x627;&#x644;&#x64a;&#x629;</td>\n<td style=\"text-align:left\">What are the chances it will happen?[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"36,44"}}],"payload":{"tag":"h2","lines":"34,35"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: What is a Security Incident (&#x645;&#x627; &#x647;&#x648; &#x627;&#x644;&#x62d;&#x627;&#x62f;&#x62b; &#x627;&#x644;&#x623;&#x645;&#x646;&#x64a;)","children":[{"content":"<strong>Information leak:</strong> Personal or confidential information is leaked.[cite: 2] (&#x62a;&#x633;&#x631;&#x64a;&#x628; &#x627;&#x644;&#x645;&#x639;&#x644;&#x648;&#x645;&#x627;&#x62a;).","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"<strong>Data tampering:</strong> Data within a system is altered without authorization.[cite: 2] (&#x627;&#x644;&#x62a;&#x644;&#x627;&#x639;&#x628; &#x628;&#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;).","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<strong>Service outage:</strong> A service becomes unavailable due to attacks.[cite: 2] (&#x627;&#x646;&#x642;&#x637;&#x627;&#x639; &#x627;&#x644;&#x62e;&#x62f;&#x645;&#x629;).","children":[],"payload":{"tag":"li","lines":"54,56"}}],"payload":{"tag":"h3","lines":"49,50"}},{"content":"Main Topic 2: The Flow of Incident Response (&#x645;&#x633;&#x627;&#x631; &#x627;&#x644;&#x627;&#x633;&#x62a;&#x62c;&#x627;&#x628;&#x629; &#x644;&#x644;&#x62d;&#x648;&#x627;&#x62f;&#x62b;)","children":[{"content":"1. <strong>Preparation (&#x627;&#x644;&#x62a;&#x62d;&#x636;&#x64a;&#x631;):</strong> Establish response procedures in advance.[cite: 2] (&#x648;&#x636;&#x639; &#x627;&#x644;&#x625;&#x62c;&#x631;&#x627;&#x621;&#x627;&#x62a; &#x645;&#x633;&#x628;&#x642;&#x627;&#x64b;).","children":[],"payload":{"tag":"li","lines":"59,60","listIndex":1}},{"content":"2. <strong>Detection (&#x627;&#x644;&#x627;&#x643;&#x62a;&#x634;&#x627;&#x641;):</strong> Discover and confirm the incident.[cite: 2] (&#x627;&#x643;&#x62a;&#x634;&#x627;&#x641; &#x648;&#x62a;&#x623;&#x643;&#x64a;&#x62f; &#x627;&#x644;&#x62d;&#x627;&#x62f;&#x62b;).","children":[],"payload":{"tag":"li","lines":"60,61","listIndex":2}},{"content":"3. <strong>Containment (&#x627;&#x644;&#x627;&#x62d;&#x62a;&#x648;&#x627;&#x621;):</strong> Limit the scope of impact so damage does not spread.[cite: 2] (&#x627;&#x644;&#x62d;&#x62f; &#x645;&#x646; &#x646;&#x637;&#x627;&#x642; &#x627;&#x644;&#x62a;&#x623;&#x62b;&#x64a;&#x631; &#x644;&#x645;&#x646;&#x639; &#x627;&#x646;&#x62a;&#x634;&#x627;&#x631; &#x627;&#x644;&#x636;&#x631;&#x631;).","children":[],"payload":{"tag":"li","lines":"61,62","listIndex":3}},{"content":"4. <strong>Eradication (&#x627;&#x644;&#x627;&#x633;&#x62a;&#x626;&#x635;&#x627;&#x644;):</strong> Remove the cause of the incident (e.g., remove malware).[cite: 2] (&#x625;&#x632;&#x627;&#x644;&#x629; &#x633;&#x628;&#x628; &#x627;&#x644;&#x62d;&#x627;&#x62f;&#x62b; &#x645;&#x62b;&#x644; &#x625;&#x632;&#x627;&#x644;&#x629; &#x627;&#x644;&#x628;&#x631;&#x627;&#x645;&#x62c; &#x627;&#x644;&#x636;&#x627;&#x631;&#x629;).","children":[],"payload":{"tag":"li","lines":"62,63","listIndex":4}},{"content":"5. <strong>Recovery (&#x627;&#x644;&#x627;&#x633;&#x62a;&#x631;&#x62f;&#x627;&#x62f;):</strong> Return systems to their normal state.[cite: 2] (&#x625;&#x639;&#x627;&#x62f;&#x629; &#x627;&#x644;&#x623;&#x646;&#x638;&#x645;&#x629; &#x625;&#x644;&#x649; &#x62d;&#x627;&#x644;&#x62a;&#x647;&#x627; &#x627;&#x644;&#x637;&#x628;&#x64a;&#x639;&#x64a;&#x629;).","children":[],"payload":{"tag":"li","lines":"63,64","listIndex":5}},{"content":"6. <strong>Prevention of recurrence (&#x645;&#x646;&#x639; &#x627;&#x644;&#x62a;&#x643;&#x631;&#x627;&#x631;):</strong> Analyze the cause and take measures so it doesn&apos;t happen again.[cite: 2] (&#x62a;&#x62d;&#x644;&#x64a;&#x644; &#x627;&#x644;&#x633;&#x628;&#x628; &#x648;&#x627;&#x62a;&#x62e;&#x627;&#x630; &#x62a;&#x62f;&#x627;&#x628;&#x64a;&#x631; &#x644;&#x645;&#x646;&#x639; &#x62a;&#x643;&#x631;&#x627;&#x631;&#x647;).","children":[],"payload":{"tag":"li","lines":"64,66","listIndex":6}}],"payload":{"tag":"h3","lines":"56,57"}},{"content":"Main Topic 3: The Concept of Risk Assessment (&#x645;&#x641;&#x647;&#x648;&#x645; &#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x645;&#x62e;&#x627;&#x637;&#x631;)","children":[],"payload":{"tag":"h3","lines":"66,67"}}],"payload":{"tag":"h2","lines":"47,48"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: Containment vs. Eradication[cite: 2]","children":[],"payload":{"tag":"h3","lines":"78,79"}}],"payload":{"tag":"h2","lines":"76,77"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"87,91\">\n<thead data-lines=\"87,88\">\n<tr data-lines=\"87,88\">\n<th style=\"text-align:left\">Concept</th>\n<th style=\"text-align:left\">Meaning (&#x627;&#x644;&#x645;&#x639;&#x646;&#x649;)[cite: 2]</th>\n<th style=\"text-align:left\">Priority Level (&#x645;&#x633;&#x62a;&#x648;&#x649; &#x627;&#x644;&#x623;&#x648;&#x644;&#x648;&#x64a;&#x629;)[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"89,91\">\n<tr data-lines=\"89,90\">\n<td style=\"text-align:left\"><strong>High Impact, High Likelihood</strong></td>\n<td style=\"text-align:left\">Disaster is severe and very likely to happen.</td>\n<td style=\"text-align:left\"><strong>Critical (Address First)</strong></td>\n</tr>\n<tr data-lines=\"90,91\">\n<td style=\"text-align:left\"><strong>Low Impact, Low Likelihood</strong></td>\n<td style=\"text-align:left\">Damage is small and rarely happens.</td>\n<td style=\"text-align:left\"><strong>Low Priority</strong></td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"87,91"}}],"payload":{"tag":"h2","lines":"85,86"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image:</strong> A flowchart showing the 6 boxes connected by arrows in a straight line: Preparation &#x2192; Detection &#x2192; Containment &#x2192; Eradication &#x2192; Recovery &#x2192; Prevention.[cite: 2]","children":[{"content":"<em>Search Keywords:</em> &quot;Incident response 6 phases flow chart&quot;","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"li","lines":"96,99"}}],"payload":{"tag":"h2","lines":"94,95"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f7e2; Information leak.[cite: 2]","children":[],"payload":{"tag":"li","lines":"107,108"}},{"content":"&#x1f7e2; Data tampering.[cite: 2]","children":[],"payload":{"tag":"li","lines":"108,109"}},{"content":"&#x1f7e2; Service outage.[cite: 2]","children":[],"payload":{"tag":"li","lines":"109,111"}}],"payload":{"tag":"ul","lines":"107,111"}},{"content":"","children":[{"content":"&#x1f535; 1. Preparation (Set up in advance).[cite: 2]","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"&#x1f535; 2. Detection (Find it).[cite: 2]","children":[],"payload":{"tag":"li","lines":"113,114"}},{"content":"&#x1f535; 3. Containment (Limit the spread).[cite: 2]","children":[],"payload":{"tag":"li","lines":"114,115"}},{"content":"&#x1f535; 4. Eradication (Remove the cause).[cite: 2]","children":[],"payload":{"tag":"li","lines":"115,116"}},{"content":"&#x1f535; 5. Recovery (Restore systems).[cite: 2]","children":[],"payload":{"tag":"li","lines":"116,117"}},{"content":"&#x1f535; 6. Prevention (Stop it happening again).[cite: 2]","children":[],"payload":{"tag":"li","lines":"117,119"}}],"payload":{"tag":"ul","lines":"112,119"}},{"content":"","children":[{"content":"&#x2b50; Risk = Impact &#xd7; Likelihood.[cite: 2]","children":[],"payload":{"tag":"li","lines":"120,121"}},{"content":"&#x26a0;&#xfe0f; Address High Impact + High Likelihood FIRST.[cite: 2]","children":[],"payload":{"tag":"li","lines":"121,123"}}],"payload":{"tag":"ul","lines":"120,123"}}],"payload":{"tag":"h2","lines":"101,102"}},{"content":"9. EXAM-FOCUSED SECTION (&#x642;&#x633;&#x645; &#x627;&#x644;&#x62a;&#x631;&#x643;&#x64a;&#x632; &#x639;&#x644;&#x649; &#x627;&#x644;&#x627;&#x645;&#x62a;&#x62d;&#x627;&#x646;)","children":[{"content":"The <strong>exact order</strong> of the 6 stages is critical. You MUST do <strong>Containment</strong> (limiting the spread) before <strong>Eradication</strong> (removing the virus), and Eradication before <strong>Recovery</strong> (if you recover before eradicating, the virus will just destroy the system again).[cite: 2]","children":[],"payload":{"tag":"li","lines":"128,129"}},{"content":"Risk is calculated by multiplying <strong>Impact</strong> (damage size) by <strong>Likelihood</strong> (probability).[cite: 2]","children":[],"payload":{"tag":"li","lines":"129,131"}}],"payload":{"tag":"h2","lines":"125,126"}},{"content":"10. QUESTIONS FOR SELF-ASSESSMENT (&#x623;&#x633;&#x626;&#x644;&#x629; &#x644;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x630;&#x627;&#x62a;&#x64a;)","children":[],"payload":{"tag":"h2","lines":"133,134"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
