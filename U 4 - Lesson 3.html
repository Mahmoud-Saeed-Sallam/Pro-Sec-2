43;&#x645;&#x64a;&#x60c; &#x648;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x645;&#x624;&#x634;&#x631;&#x627;&#x62a; &#x627;&#x644;&#x631;&#x626;&#x64a;&#x633;&#x64a;&#x629; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;&#x629; &#x641;&#x64a; &#x62a;&#x62d;&#x644;&#x64a;&#x644;&#x627;&#x62a; &#x627;&#x644;&#x648;&#x64a;&#x628;.","children":[],"payload":{"tag":"li","lines":"27,29"}},{"content":"<strong>Explain</strong> how heuristic evaluation works, and why combining both approaches gives a clearer picture.[cite: 2]<br>\n<strong>&#x634;&#x631;&#x62d;</strong> &#x643;&#x64a;&#x641; &#x64a;&#x639;&#x645;&#x644; &#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x625;&#x631;&#x634;&#x627;&#x62f;&#x64a; (&#x641;&#x62d;&#x635; &#x627;&#x644;&#x62e;&#x628;&#x631;&#x627;&#x621;)&#x60c; &#x648;&#x644;&#x645;&#x627;&#x630;&#x627; &#x64a;&#x639;&#x637;&#x64a; &#x627;&#x644;&#x62c;&#x645;&#x639; &#x628;&#x64a;&#x646; &#x643;&#x644;&#x627; &#x627;&#x644;&#x646;&#x647;&#x62c;&#x64a;&#x646; &#x635;&#x648;&#x631;&#x629; &#x623;&#x648;&#x636;&#x62d;.","children":[],"payload":{"tag":"li","lines":"29,32"}}],"payload":{"tag":"h2","lines":"22,23"}},{"content":"3. KEY VOCABULARY (&#x627;&#x644;&#x645;&#x635;&#x637;&#x644;&#x62d;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629;)","children":[{"content":"<table data-lines=\"36,44\">\n<thead data-lines=\"36,37\">\n<tr data-lines=\"36,37\">\n<th style=\"text-align:left\">English Term</th>\n<th style=\"text-align:left\">Simple English Meaning</th>\n<th style=\"text-align:left\">Arabic Meaning</th>\n<th style=\"text-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"38,44\">\n<tr data-lines=\"38,39\">\n<td style=\"text-align:left\"><strong>Qualitative eval</strong></td>\n<td style=\"text-align:left\">Explores the &quot;why&quot; from users&apos; voices.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x646;&#x648;&#x639;&#x64a;</td>\n<td style=\"text-align:left\">Talking to users to find out <em>why</em> they are confused.[cite: 2]</td>\n</tr>\n<tr data-lines=\"39,40\">\n<td style=\"text-align:left\"><strong>Quantitative eval</strong></td>\n<td style=\"text-align:left\">Uses numbers to show &quot;how much.&quot;[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x643;&#x645;&#x64a;</td>\n<td style=\"text-align:left\">Looking at charts to see <em>how many</em> people clicked.[cite: 2]</td>\n</tr>\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>PV (Page View)</strong></td>\n<td style=\"text-align:left\">Total times a page was viewed.[cite: 2]</td>\n<td style=\"text-align:left\">&#x645;&#x634;&#x627;&#x647;&#x62f;&#x627;&#x62a; &#x627;&#x644;&#x635;&#x641;&#x62d;&#x629;</td>\n<td style=\"text-align:left\">Counting every time someone loads the page.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Bounce rate</strong></td>\n<td style=\"text-align:left\">Share of visits that end after only one page.[cite: 2]</td>\n<td style=\"text-align:left\">&#x645;&#x639;&#x62f;&#x644; &#x627;&#x644;&#x627;&#x631;&#x62a;&#x62f;&#x627;&#x62f;</td>\n<td style=\"text-align:left\">People who open the site and leave immediately.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>CVR (Conversion rate)</strong></td>\n<td style=\"text-align:left\">Share of visits that reach the target action.[cite: 2]</td>\n<td style=\"text-align:left\">&#x645;&#x639;&#x62f;&#x644; &#x627;&#x644;&#x62a;&#x62d;&#x648;&#x64a;&#x644;</td>\n<td style=\"text-align:left\">People who actually bought something or signed up.[cite: 2]</td>\n</tr>\n<tr data-lines=\"43,44\">\n<td style=\"text-align:left\"><strong>Heuristic eval</strong></td>\n<td style=\"text-align:left\">Experts check the UI by rules of thumb.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x625;&#x631;&#x634;&#x627;&#x62f;&#x64a; (&#x644;&#x644;&#x62e;&#x628;&#x631;&#x627;&#x621;)</td>\n<td style=\"text-align:left\">Experts reviewing the site to spot obvious design errors.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"36,44"}}],"payload":{"tag":"h2","lines":"34,35"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: Qualitative vs. Quantitative Evaluation (&#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x646;&#x648;&#x639;&#x64a; &#x645;&#x642;&#x627;&#x628;&#x644; &#x627;&#x644;&#x643;&#x645;&#x64a;)","children":[],"payload":{"tag":"h3","lines":"49,50"}},{"content":"Main Topic 2: Web Analytics Indicators (&#x645;&#x624;&#x634;&#x631;&#x627;&#x62a; &#x62a;&#x62d;&#x644;&#x64a;&#x644;&#x627;&#x62a; &#x627;&#x644;&#x648;&#x64a;&#x628;)","children":[{"content":"1. <strong>PV (Page View):</strong> The total number of times a page has been viewed.[cite: 2]<br>\n&#x625;&#x62c;&#x645;&#x627;&#x644;&#x64a; &#x639;&#x62f;&#x62f; &#x627;&#x644;&#x645;&#x631;&#x627;&#x62a; &#x627;&#x644;&#x62a;&#x64a; &#x62a;&#x645;&#x62a; &#x641;&#x64a;&#x647;&#x627; &#x645;&#x634;&#x627;&#x647;&#x62f;&#x629; &#x627;&#x644;&#x635;&#x641;&#x62d;&#x629;.","children":[],"payload":{"tag":"li","lines":"70,72","listIndex":1}},{"content":"2. <strong>Bounce rate (&#x645;&#x639;&#x62f;&#x644; &#x627;&#x644;&#x627;&#x631;&#x62a;&#x62f;&#x627;&#x62f;):</strong> The proportion of visits that ended after viewing only the first page.[cite: 2]<br>\n&#x646;&#x633;&#x628;&#x629; &#x627;&#x644;&#x632;&#x64a;&#x627;&#x631;&#x627;&#x62a; &#x627;&#x644;&#x62a;&#x64a; &#x627;&#x646;&#x62a;&#x647;&#x62a; &#x628;&#x639;&#x62f; &#x645;&#x634;&#x627;&#x647;&#x62f;&#x629; &#x627;&#x644;&#x635;&#x641;&#x62d;&#x629; &#x627;&#x644;&#x623;&#x648;&#x644;&#x649; &#x641;&#x642;&#x637;.","children":[],"payload":{"tag":"li","lines":"72,74","listIndex":2}},{"content":"3. <strong>Conversion rate (CVR) (&#x645;&#x639;&#x62f;&#x644; &#x627;&#x644;&#x62a;&#x62d;&#x648;&#x64a;&#x644;):</strong> The proportion of visits that achieved a target action (purchase, registration, etc.).[cite: 2]<br>\n&#x646;&#x633;&#x628;&#x629; &#x627;&#x644;&#x632;&#x64a;&#x627;&#x631;&#x627;&#x62a; &#x627;&#x644;&#x62a;&#x64a; &#x62d;&#x642;&#x642;&#x62a; &#x625;&#x62c;&#x631;&#x627;&#x621;&#x64b; &#x645;&#x633;&#x62a;&#x647;&#x62f;&#x641;&#x627;&#x64b; (&#x634;&#x631;&#x627;&#x621;&#x60c; &#x62a;&#x633;&#x62c;&#x64a;&#x644;&#x60c; &#x625;&#x644;&#x62e;).","children":[],"payload":{"tag":"li","lines":"74,77","listIndex":3}}],"payload":{"tag":"h3","lines":"67,68"}},{"content":"Main Topic 3: Heuristic Evaluation (&#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x625;&#x631;&#x634;&#x627;&#x62f;&#x64a; - &#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x62e;&#x628;&#x631;&#x627;&#x621;)","children":[{"content":"<strong>Consistency:</strong> Whether design is unified.[cite: 2] (&#x627;&#x644;&#x627;&#x62a;&#x633;&#x627;&#x642;: &#x645;&#x627; &#x625;&#x630;&#x627; &#x643;&#x627;&#x646; &#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645; &#x645;&#x648;&#x62d;&#x62f;&#x627;&#x64b;).","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"<strong>Error prevention:</strong> Making it hard for users to make mistakes.[cite: 2] (&#x645;&#x646;&#x639; &#x627;&#x644;&#x623;&#x62e;&#x637;&#x627;&#x621;).","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"<strong>Visibility of system status:</strong> Showing processing indicators.[cite: 2] (&#x631;&#x624;&#x64a;&#x629; &#x62d;&#x627;&#x644;&#x629; &#x627;&#x644;&#x646;&#x638;&#x627;&#x645;: &#x625;&#x638;&#x647;&#x627;&#x631; &#x645;&#x624;&#x634;&#x631;&#x627;&#x62a; &#x627;&#x644;&#x645;&#x639;&#x627;&#x644;&#x62c;&#x629;).","children":[],"payload":{"tag":"li","lines":"84,86"}}],"paylo
