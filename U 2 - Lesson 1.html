&#x627;&#x644;&#x646;&#x635; &#x627;&#x644;&#x62a;&#x634;&#x639;&#x628;&#x64a; &#x627;&#x644;&#x622;&#x645;&#x646;</td>\n<td style=\"text-align:left\">The secure version of HTTP used for websites.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Public-key cryptography</strong></td>\n<td style=\"text-align:left\">Used to share a key safely.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62a;&#x634;&#x641;&#x64a;&#x631; &#x627;&#x644;&#x645;&#x641;&#x62a;&#x627;&#x62d; &#x627;&#x644;&#x639;&#x627;&#x645;</td>\n<td style=\"text-align:left\">Safe way to give someone a secret key.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>Common-key cryptography</strong></td>\n<td style=\"text-align:left\">Used to exchange large amounts of data quickly.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62a;&#x634;&#x641;&#x64a;&#x631; &#x627;&#x644;&#x645;&#x641;&#x62a;&#x627;&#x62d; &#x627;&#x644;&#x645;&#x634;&#x62a;&#x631;&#x643;</td>\n<td style=\"text-align:left\">Fast way to encrypt and send data.[cite: 2]</td>\n</tr>\n<tr data-lines=\"43,44\">\n<td style=\"text-align:left\"><strong>Multi-factor authentication (MFA)</strong></td>\n<td style=\"text-align:left\">Combining two or more factors (knowledge, possession, biometric).[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x645;&#x635;&#x627;&#x62f;&#x642;&#x629; &#x645;&#x62a;&#x639;&#x62f;&#x62f;&#x629; &#x627;&#x644;&#x639;&#x648;&#x627;&#x645;&#x644;</td>\n<td style=\"text-align:left\">Needing a password AND a code on your phone to log in.[cite: 2]</td>\n</tr>\n<tr data-lines=\"44,45\">\n<td style=\"text-align:left\"><strong>Digital signature</strong></td>\n<td style=\"text-align:left\">Detects tampering and impersonation, and provides non-repudiation.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x648;&#x642;&#x64a;&#x639; &#x627;&#x644;&#x631;&#x642;&#x645;&#x64a;</td>\n<td style=\"text-align:left\">Proves who sent the data and that it wasn&apos;t changed.[cite: 2]</td>\n</tr>\n<tr data-lines=\"45,46\">\n<td style=\"text-align:left\"><strong>Digital certificate</strong></td>\n<td style=\"text-align:left\">Proves a site is genuine.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x634;&#x647;&#x627;&#x62f;&#x629; &#x627;&#x644;&#x631;&#x642;&#x645;&#x64a;&#x629;</td>\n<td style=\"text-align:left\">Like an ID card for a website.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"38,46"}}],"payload":{"tag":"h2","lines":"36,37"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: How HTTPS Communication Works (&#x643;&#x64a;&#x641; &#x64a;&#x639;&#x645;&#x644; &#x627;&#x62a;&#x635;&#x627;&#x644; HTTPS)","children":[{"content":"1. <strong>Connection (&#x627;&#x644;&#x627;&#x62a;&#x635;&#x627;&#x644;):</strong> The web server sends a digital certificate and a public key to the browser.[cite: 2]<br>\n&#x64a;&#x631;&#x633;&#x644; &#x62e;&#x627;&#x62f;&#x645; &#x627;&#x644;&#x648;&#x64a;&#x628; &#x634;&#x647;&#x627;&#x62f;&#x629; &#x631;&#x642;&#x645;&#x64a;&#x629; &#x648;&#x645;&#x641;&#x62a;&#x627;&#x62d;&#x627;&#x64b; &#x639;&#x627;&#x645;&#x627;&#x64b; &#x625;&#x644;&#x649; &#x627;&#x644;&#x645;&#x62a;&#x635;&#x641;&#x62d;.","children":[],"payload":{"tag":"li","lines":"57,59","listIndex":1}},{"content":"2. <strong>Key Exchange (&#x62a;&#x628;&#x627;&#x62f;&#x644; &#x627;&#x644;&#x645;&#x641;&#x627;&#x62a;&#x64a;&#x62d;):</strong> The browser creates a common key, encrypts it with the public key, and sends it to the server.[cite: 2]<br>\n&#x64a;&#x642;&#x648;&#x645; &#x627;&#x644;&#x645;&#x62a;&#x635;&#x641;&#x62d; &#x628;&#x625;&#x646;&#x634;&#x627;&#x621; &#x645;&#x641;&#x62a;&#x627;&#x62d; &#x645;&#x634;&#x62a;&#x631;&#x643;&#x60c; &#x648;&#x62a;&#x634;&#x641;&#x64a;&#x631;&#x647; &#x628;&#x627;&#x644;&#x645;&#x641;&#x62a;&#x627;&#x62d; &#x627;&#x644;&#x639;&#x627;&#x645;&#x60c; &#x648;&#x625;&#x631;&#x633;&#x627;&#x644;&#x647; &#x625;&#x644;&#x649; &#x627;&#x644;&#x62e;&#x627;&#x62f;&#x645;.<br>\nThis uses <strong>Public-key cryptography</strong> to &quot;share keys safely.&quot;[cite: 2]<br>\n&#x647;&#x630;&#x627; &#x64a;&#x633;&#x62a;&#x62e;&#x62f;&#x645; <strong>&#x62a;&#x634;&#x641;&#x64a;&#x631; &#x627;&#x644;&#x645;&#x641;&#x62a;&#x627;&#x62d; &#x627;&#x644;&#x639;&#x627;&#x645;</strong> &#x644;&#x640; &quot;&#x645;&#x634;&#x627;&#x631;&#x643;&#x629; &#x627;&#x644;&#x645;&#x641;&#x627;&#x62a;&#x64a;&#x62d; &#x628;&#x623;&#x645;&#x627;&#x646;&quot;.","children":[],"payload":{"tag":"li","lines":"59,63","listIndex":2}},{"content":"3. <strong>Data Transfer (&#x646;&#x642;&#x644; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;):</strong> Encrypted data is transferred using the shared common key.[cite: 2]<br>\n&#x64a;&#x62a;&#x645; &#x646;&#x642;&#x644; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x627;&#x644;&#x645;&#x634;&#x641;&#x631;&#x629; &#x628;&#x627;&#x633;&#x62a;&#x62e;&#x62f;&#x627;&#x645; &#x627;&#x644;&#x645;&#x641;&#x62a;&#x627;&#x62d; &#x627;&#x644;&#x645;&#x634;&#x62a;&#x631;&#x643; &#x627;&#x644;&#x630;&#x64a; &#x62a;&#x645; &#x645;&#x634;&#x627;&#x631;&#x643;&#x62a;&#x647;.<br>\nThis uses <strong>Common-key cryptography</strong> to &quot;exchange large amounts of data quickly.&quot;[cite: 2]<br>\n&#x64a;&#x633;&#x62a;&#x62e;&#x62f;&#x645; &#x647;&#x630;&#x627; <strong>&#x62a;&#x634;&#x641;&#x64a;&#x631; &#x627;&#x644;&#x645;&#x641;&#x62a;&#x627;&#x62d; &#x627;&#x644;&#x645;&#x634;&#x62a;&#x631;&#x643;</strong> &#x644;&#x640; &quot;&#x62a;&#x628;&#x627;&#x62f;&#x644; &#x643;&#x645;&#x64a;&#x627;&#x62a; &#x643;&#x628;&#x64a;&#x631;&#x629; &#x645;&#x646; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x628;&#x633;&#x631;&#x639;&#x629;&quot;.","children":[],"payload":{"tag":"li","lines":"63,68","listIndex":3}}],"payload":{"tag":"h3","lines":"51,52"}},{"content":"Main Topic 2: Use of Authentication in Real Services (&#x627;&#x633;&#x62a;&#x62e;&#x62f;&#x627;&#x645; &#x627;&#x644;&#x645;&#x635;&#x627;&#x62f;&#x642;&#x629; &#x641;&#x64a; &#x627;&#x644;&#x62e;&#x62f;&#x645;&#x627;&#x62a; &#x627;&#x644;&#x62d;&#x642;&#x64a;&#x642;&#x64a;&#x629;)","children":[],"payload":{"tag":"h3","lines":"68,69"}},{"content":"Main Topic 3: Combinations of Security Technologies (&#x627;&#x644;&#x62c;&#x645;&#x639; &#x628;&#x64a;&#x646; &#x62a;&#x642;&#x646;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x645;&#x627;&#x646;)","children":[{"content":"<strong>Encryption (&#x627;&#x644;&#x62a;&#x634;&#x641;&#x64a;&#x631;):</strong> Prevents content from being read by third parties.[cite: 2]<br>\n&#x64a;&#x645;&#x646;&#x639; &#x642;&#x631;&#x627;&#x621;&#x629; &#x627;&#x644;&#x645;&#x62d;&#x62a;&#x648;&#x649; &#x645;&#x646; &#x642;&#x628;&#x644; &#x623;&#x637;&#x631;&#x627;&#x641; &#x62b;&#x627;&#x644;&#x62b;&#x629;.","children":[],"payload":{"tag":"li","lines":"79,81"}},{"content":"<strong>Digital certificate (&#x627;&#x644;&#x634;&#x647;&#x627;&#x62f;&#x629; &#x627;&#x644;&#x631;&#x642;&#x645;&#x64a;&#x629;):</strong> Verifies that the communication partner is authentic.[cite: 2]<br>\n&#x64a;&#x62a;&#x62d;&#x642;&#x642; &#x645;&#x646; &#x623;&#x646; &#x634;&#x631;&#x64a;&#x643; &#x627;&#x644;&#x627;&#x62a;&#x635;&#x627;&#x644; &#x623;&#x635;&#x644;&#x64a; (&#x62d;&#x642;&#x64a;&#x642;&#x64a;).","children":[],"payload":{"tag":"li","lines":"81,83"}},{"content":"<strong>Digital signature (&#x627;&#x644;&#x62a;&#x648;&#x642;&#x64a;&#x639; &#x627;&#x644;&#x631;&#x642;&#x645;&#x64a;):</strong> Detects data tampering and provides non-repudiation.[cite: 2]<br>\n&#x64a;&#x643;&#x62a;&#x634;&#x641; &#x627;&#x644;&#x62a;&#x644;&#x627;&#x639;&#x628; &#x628;&#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x648;&#x64a;&#x648;&#x641;&#x631; &#x645;&#x64a;&#x632;&#x629; &#x639;&#x62f;&#x645; &#x627;&#x644;&#x62a;&#x646;&#x635;&#x644; (&#x639;&#x62f;&#x645; &#x627;&#x644;&#x642;&#x62f;&#x631;&#x629; &#x639;&#x644;&#x649; &#x625;&#x646;&#x643;&#x627;&#x631; &#x627;&#x644;&#x625;&#x631;&#x633;&#x627;&#x644;).","children":[],"payload":{"tag":"li","lines":"83,85"}},{"content":"<strong>Multi-factor authentication (&#x627;&#x644;&#x645;&#x635;&#x627;&#x62f;&#x642;&#x629; &#x645;&#x62a;&#x639;&#x62f;&#x62f;&#x629; &#x627;&#x644;&#x639;&#x648;&#x627;&#x645;&#x644;):</strong> Prevents unauthorized logins.[cite: 2]<br>\n&#x62a;&#x645;&#x646;&#x639; &#x639;&#x645;&#x644;&#x64a;&#x627;&#x62a; &#x62a;&#x633;&#x62c;&#x64a;&#x644; &#x627;&#x644;&#x62f;&#x62e;&#x648;&#x644; &#x63a;&#x64a;&#x631; &#x627;&#x644;&#x645;&#x635;&#x631;&#x62d; &#x628;&#x647;&#x627;.","children":[],"payload":{"tag":"li","lines":"85,88"}}],"payload":{"tag":"h3","lines":"76,77"}}],"payload":{"tag":"h2","lines":"49,50"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: Public Key vs. Common Key in HTTPS[cite: 2]","children":[],"payload":{"tag":"h3","lines":"92,93"}}],"payload":{"tag":"h2","lines":"90,91"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"101,107\">\n<thead data-lines=\"101,102\">\n<tr data-lines=\"101,102\">\n<th style=\"text-align:left\">Technology (&#x627;&#x644;&#x62a;&#x642;&#x646;&#x64a;&#x629;)[cite: 2]</th>\n<th style=\"text-align:left\">Effect (&#x627;&#x644;&#x62a;&#x623;&#x62b;&#x64a;&#x631; / &#x627;&#x644;&#x641;&#x627;&#x626;&#x62f;&#x629;)[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"103,107\">\n<tr data-lines=\"103,104\">\n<td style=\"text-align:left\"><strong>Encryption (&#x627;&#x644;&#x62a;&#x634;&#x641;&#x64a;&#x631;)</strong></td>\n<td style=\"text-align:left\">Hides data from being read.</td>\n</tr>\n<tr data-lines=\"104,105\">\n<td style=\"text-align:left\"><strong>Digital Certificate (&#x627;&#x644;&#x634;&#x647;&#x627;&#x62f;&#x629; &#x627;&#x644;&#x631;&#x642;&#x645;&#x64a;&#x629;)</strong></td>\n<td style=\"text-align:left\">Proves the website is real (not fake).</td>\n</tr>\n<tr data-lines=\"105,106\">\n<td style=\"text-align:left\"><strong>Digital Signature (&#x627;&#x644;&#x62a;&#x648;&#x642;&#x64a;&#x639; &#x627;&#x644;&#x631;&#x642;&#x645;&#x64a;)</strong></td>\n<td style=\"text-align:left\">Proves the sender&apos;s identity and that data wasn&apos;t changed.</td>\n</tr>\n<tr data-lines=\"106,107\">\n<td style=\"text-align:left\"><strong>Multi-factor Auth (&#x627;&#x644;&#x645;&#x635;&#x627;&#x62f;&#x642;&#x629; &#x627;&#x644;&#x645;&#x62a;&#x639;&#x62f;&#x62f;&#x629;)</strong></td>\n<td style=\"text-align:left\">Stops hackers even if they steal your password.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"101,107"}}],"payload":{"tag":"h2","lines":"99,100"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image:</strong> A diagram showing the TLS Handshake. Step 1: Server sends Certificate &amp; Public Key. Step 2: Browser encrypts a Common Key using the Public Key and sends it. Step 3: Fast data transfer using the Common Key.[cite: 2]","children":[{"content":"<em>Search Keywords:</em> &quot;HTTPS TLS handshake diagram public key common key&quot;","children":[],"payload":{"tag":"li","lines":"113,115"}}],"payload":{"tag":"li","lines":"112,115"}}],"payload":{"tag":"h2","lines":"110,111"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f7e2; 1. Connection (Server sends Cert + Public Key).[cite: 2]","
