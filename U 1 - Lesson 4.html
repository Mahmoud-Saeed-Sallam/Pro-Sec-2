27;&#x631;&#x632;&#x645;&#x64a; &#x648;&#x648;&#x635;&#x641; &#x623;&#x633;&#x628;&#x627;&#x628;&#x647; &#x627;&#x644;&#x631;&#x626;&#x64a;&#x633;&#x64a;&#x629;.","children":[],"payload":{"tag":"li","lines":"29,31"}},{"content":"<strong>Connect</strong> the basic principles of AI ethics (fairness, transparency, privacy protection, and accountability) to specific situations.[cite: 2]<br>\n<strong>&#x631;&#x628;&#x637;</strong> &#x627;&#x644;&#x645;&#x628;&#x627;&#x62f;&#x626; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629; &#x644;&#x623;&#x62e;&#x644;&#x627;&#x642;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x628;&#x645;&#x648;&#x627;&#x642;&#x641; &#x645;&#x62d;&#x62f;&#x62f;&#x629;.","children":[],"payload":{"tag":"li","lines":"31,34"}}],"payload":{"tag":"h2","lines":"24,25"}},{"content":"3. KEY VOCABULARY (&#x627;&#x644;&#x645;&#x635;&#x637;&#x644;&#x62d;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629;)","children":[{"content":"<table data-lines=\"38,45\">\n<thead data-lines=\"38,39\">\n<tr data-lines=\"38,39\">\n<th style=\"text-align:left\">English Term</th>\n<th style=\"text-align:left\">Simple English Meaning</th>\n<th style=\"text-align:left\">Arabic Meaning</th>\n<th style=\"text-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"40,45\">\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>Algorithmic bias</strong></td>\n<td style=\"text-align:left\">Bias in AI judgments caused by bias in the training data.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x62d;&#x64a;&#x632; &#x627;&#x644;&#x62e;&#x648;&#x627;&#x631;&#x632;&#x645;&#x64a;</td>\n<td style=\"text-align:left\">The AI becomes unfair because the data it studied was unfair.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Explainable AI (XAI)</strong></td>\n<td style=\"text-align:left\">Technology that lets humans understand why an AI made a judgment.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x627;&#x644;&#x642;&#x627;&#x628;&#x644; &#x644;&#x644;&#x634;&#x631;&#x62d;</td>\n<td style=\"text-align:left\">An AI that can explain <em>why</em> it gave that answer.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>Fairness</strong></td>\n<td style=\"text-align:left\">Not unjustly discriminating against a person or group.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x639;&#x62f;&#x627;&#x644;&#x629;</td>\n<td style=\"text-align:left\">Treating everyone equally without prejudice.[cite: 2]</td>\n</tr>\n<tr data-lines=\"43,44\">\n<td style=\"text-align:left\"><strong>Transparency</strong></td>\n<td style=\"text-align:left\">Showing the AI&apos;s decision-making process clearly.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x634;&#x641;&#x627;&#x641;&#x64a;&#x629;</td>\n<td style=\"text-align:left\">Not keeping the AI&apos;s logic a secret.[cite: 2]</td>\n</tr>\n<tr data-lines=\"44,45\">\n<td style=\"text-align:left\"><strong>Accountability</strong></td>\n<td style=\"text-align:left\">Being answerable for the AI&apos;s decisions.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x645;&#x633;&#x627;&#x621;&#x644;&#x629;</td>\n<td style=\"text-align:left\">Knowing exactly who is responsible if the AI makes a mistake.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"38,45"}}],"payload":{"tag":"h2","lines":"36,37"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: Algorithmic Bias (&#x627;&#x644;&#x62a;&#x62d;&#x64a;&#x632; &#x627;&#x644;&#x62e;&#x648;&#x627;&#x631;&#x632;&#x645;&#x64a;)","children":[{"content":"Training data is biased (e.g., insufficient data on certain attributes, or past discriminatory tendencies are reflected in the data).[cite: 2]<br>\n&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x627;&#x644;&#x62a;&#x62f;&#x631;&#x64a;&#x628; &#x645;&#x62a;&#x62d;&#x64a;&#x632;&#x629; (&#x645;&#x62b;&#x644;: &#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x63a;&#x64a;&#x631; &#x643;&#x627;&#x641;&#x64a;&#x629; &#x62d;&#x648;&#x644; &#x633;&#x645;&#x627;&#x62a; &#x645;&#x639;&#x64a;&#x646;&#x629;&#x60c; &#x623;&#x648; &#x627;&#x646;&#x639;&#x643;&#x627;&#x633; &#x645;&#x64a;&#x648;&#x644; &#x62a;&#x645;&#x64a;&#x64a;&#x632;&#x64a;&#x629; &#x633;&#x627;&#x628;&#x642;&#x629; &#x641;&#x64a; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;).","children":[],"payload":{"tag":"li","lines":"56,59"}}],"payload":{"tag":"h3","lines":"50,51"}},{"content":"Main Topic 2: Privacy Issues (&#x642;&#x636;&#x627;&#x64a;&#x627; &#x627;&#x644;&#x62e;&#x635;&#x648;&#x635;&#x64a;&#x629;)","children":[{"content":"<strong>Surveillance through face-recognition technology:</strong> Cameras in public spaces can identify and track individuals.[cite: 2]<br>\n&#x627;&#x644;&#x645;&#x631;&#x627;&#x642;&#x628;&#x629; &#x645;&#x646; &#x62e;&#x644;&#x627;&#x644; &#x62a;&#x642;&#x646;&#x64a;&#x629; &#x627;&#x644;&#x62a;&#x639;&#x631;&#x641; &#x639;&#x644;&#x649; &#x627;&#x644;&#x648;&#x62c;&#x648;&#x647;: &#x64a;&#x645;&#x643;&#x646; &#x644;&#x644;&#x643;&#x627;&#x645;&#x64a;&#x631;&#x627;&#x62a; &#x641;&#x64a; &#x627;&#x644;&#x623;&#x645;&#x627;&#x643;&#x646; &#x627;&#x644;&#x639;&#x627;&#x645;&#x629; &#x62a;&#x62d;&#x62f;&#x64a;&#x62f; &#x627;&#x644;&#x623;&#x641;&#x631;&#x627;&#x62f; &#x648;&#x62a;&#x62a;&#x628;&#x639;&#x647;&#x645;.","children":[],"payload":{"tag":"li","lines":"62,64"}},{"content":"<strong>Mass collection of personal data:</strong> Large amounts of online behavior data are collected and analyzed.[cite: 2]<br>\n&#x627;&#x644;&#x62c;&#x645;&#x639; &#x627;&#x644;&#x62c;&#x645;&#x627;&#x639;&#x64a; &#x644;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x627;&#x644;&#x634;&#x62e;&#x635;&#x64a;&#x629;: &#x64a;&#x62a;&#x645; &#x62c;&#x645;&#x639; &#x648;&#x62a;&#x62d;&#x644;&#x64a;&#x644; &#x643;&#x645;&#x64a;&#x627;&#x62a; &#x643;&#x628;&#x64a;&#x631;&#x629; &#x645;&#x646; &#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x627;&#x644;&#x633;&#x644;&#x648;&#x643; &#x639;&#x628;&#x631; &#x627;&#x644;&#x625;&#x646;&#x62a;&#x631;&#x646;&#x62a;.","children":[],"payload":{"tag":"li","lines":"64,67"}}],"payload":{"tag":"h3","lines":"59,60"}},{"content":"Main Topic 3: Explainable AI (XAI) and Responsibility (&#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x627;&#x644;&#x642;&#x627;&#x628;&#x644; &#x644;&#x644;&#x634;&#x631;&#x62d; &#x648;&#x627;&#x644;&#x645;&#x633;&#x624;&#x648;&#x644;&#x64a;&#x629;)","children":[],"payload":{"tag":"h3","lines":"67,68"}},{"content":"Main Topic 4: Basic Principles of AI Ethics (&#x627;&#x644;&#x645;&#x628;&#x627;&#x62f;&#x626; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629; &#x644;&#x623;&#x62e;&#x644;&#x627;&#x642;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;)","children":[{"content":"1. <strong>Fairness (&#x627;&#x644;&#x639;&#x62f;&#x627;&#x644;&#x629;):</strong> Not unjustly discriminating against any particular person or group.[cite: 2]<br>\n&#x639;&#x62f;&#x645; &#x627;&#x644;&#x62a;&#x645;&#x64a;&#x64a;&#x632; &#x638;&#x644;&#x645;&#x627;&#x64b; &#x636;&#x62f; &#x623;&#x64a; &#x634;&#x62e;&#x635; &#x623;&#x648; &#x645;&#x62c;&#x645;&#x648;&#x639;&#x629; &#x645;&#x639;&#x64a;&#x646;&#x629;.","children":[],"payload":{"tag":"li","lines":"80,82","listIndex":1}},{"content":"2. <strong>Transparency (&#x627;&#x644;&#x634;&#x641;&#x627;&#x641;&#x64a;&#x629;):</strong> Showing the AI&apos;s decision-making process and inner workings clearly.[cite: 2]<br>\n&#x625;&#x638;&#x647;&#x627;&#x631; &#x639;&#x645;&#x644;&#x64a;&#x629; &#x627;&#x62a;&#x62e;&#x627;&#x630; &#x627;&#x644;&#x642;&#x631;&#x627;&#x631; &#x648;&#x622;&#x644;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x639;&#x645;&#x644; &#x627;&#x644;&#x62f;&#x627;&#x62e;&#x644;&#x64a;&#x629; &#x644;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a; &#x628;&#x648;&#x636;&#x648;&#x62d;.","children":[],"payload":{"tag":"li","lines":"82,84","listIndex":2}},{"content":"3. <strong>Privacy protection (&#x62d;&#x645;&#x627;&#x64a;&#x629; &#x627;&#x644;&#x62e;&#x635;&#x648;&#x635;&#x64a;&#x629;):</strong> Handling personal information appropriately and protecting privacy.[cite: 2]<br>\n&#x627;&#x644;&#x62a;&#x639;&#x627;&#x645;&#x644; &#x645;&#x639; &#x627;&#x644;&#x645;&#x639;&#x644;&#x648;&#x645;&#x627;&#x62a; &#x627;&#x644;&#x634;&#x62e;&#x635;&#x64a;&#x629; &#x628;&#x634;&#x643;&#x644; &#x645;&#x646;&#x627;&#x633;&#x628; &#x648;&#x62d;&#x645;&#x627;&#x64a;&#x629; &#x627;&#x644;&#x62e;&#x635;&#x648;&#x635;&#x64a;&#x629;.","children":[],"payload":{"tag":"li","lines":"84,86","listIndex":3}},{"content":"4. <strong>Accountability (&#x627;&#x644;&#x645;&#x633;&#x627;&#x621;&#x644;&#x629;):</strong> Being answerable for the AI&apos;s decisions.[cite: 2]<br>\n&#x623;&#x646; &#x62a;&#x643;&#x648;&#x646; &#x62e;&#x627;&#x636;&#x639;&#x627;&#x64b; &#x644;&#x644;&#x645;&#x633;&#x627;&#x621;&#x644;&#x629; (&#x62a;&#x62a;&#x62d;&#x645;&#x644; &#x627;&#x644;&#x645;&#x633;&#x624;&#x648;&#x644;&#x64a;&#x629;) &#x639;&#x646; &#x642;&#x631;&#x627;&#x631;&#x627;&#x62a; &#x627;&#x644;&#x630;&#x643;&#x627;&#x621; &#x627;&#x644;&#x627;&#x635;&#x637;&#x646;&#x627;&#x639;&#x64a;.","children":[],"payload":{"tag":"li","lines":"86,89","listIndex":4}}],"payload":{"tag":"h3","lines":"77,78"}}],"payload":{"tag":"h2","lines":"48,49"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: Algorithmic Bias (&#x627;&#x644;&#x62a;&#x62d;&#x64a;&#x632; &#x627;&#x644;&#x62e;&#x648;&#x627;&#x631;&#x632;&#x645;&#x64a;)[cite: 2]","children":[],"payload":{"tag":"h3","lines":"93,94"}}],"payload":{"tag":"h2","lines":"91,92"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"103,108\">\n<thead data-lines=\"103,104\">\n<tr data-lines=\"103,104\">\n<th style=\"text-align:left\">Principle (&#x627;&#x644;&#x645;&#x628;&#x62f;&#x623;)</th>\n<th style=\"text-align:left\">Description (&#x627;&#x644;&#x648;&#x635;&#x641;)[cite: 2]</th>\n<th style=\"text-align:left\">Example (&#x645;&#x62b;&#x627;&#x644;)[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"105,108\">\n<tr data-lines=\"105,106\">\n<td style=\"text-align:left\"><strong>Fairness</strong></td>\n<td style=\"text-align:left\">No unjust discrimination.</td>\n<td style=\"text-align:left\">Hiring AI evaluates fairly regardless of gender.</td>\n</tr>\n<tr data-lines=\"106,107\">\n<td style=\"text-align:left\"><strong>Transparency</strong></td>\n<td style=\"text-align:left\">Showing the decision process clearly.</td>\n<td style=\"text-align:left\">Disclosing how the AI works to users.</td>\n</tr>\n<tr data-lines=\"107,108\">\n<td style=\"text-align:left\"><strong>Accountability</strong></td>\n<td style=\"text-align:left\">Being answerable for decisions.</td>\n<td style=\"text-align:left\">Knowing who pays if a diagnostic AI is wrong.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"103,108"}}],"payload":{"tag":"h2","lines":"101,102"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image 1:</strong> A scale (balance) showing fairness, weighing different people equally.[cite: 2]","children":[{"content":"<em>Represents:</em> The principle of Fairness in AI.","children":[],"payload":{"tag":"li","lines":"114,115"}}],"payload":{"tag":"li","lines":"113,115"}},{"content":"<strong>Suggested Image 2:</strong> A glass box (transparent) replacing a black box, allowing a human to see the gears inside.[cite: 2]","children":[{"content":"<em>Represents:</em> Explainable AI (XAI) and Transparency.[cite: 2]","children":[],"payload":{"tag":"li","lines":"116,118"}}],"payload":{"tag":"li","lines":"115,118"}}],"payload":{"tag":"h2","lines":"111,112"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f535; Definition: Bias in AI due to biased training data.[cite: 2]","children":[],"payload":{"tag":"li","lines":"126,127"}},{"content":"&#x1f7e2; Examples: Hiring AI gender bias, Face-recognition ethnic bias.[cite: 2]","children":[],"payload":{"tag":"li","lines":"127,128"}},{"content":"&#x26a0;&#xfe0f; Causes: Insufficient data, past discrimination in data.[cite: 2]","children":[],"payload":{"tag":"li","lines":"128,130"}}],"payload":{"tag":"ul","lines":"126,130"}},{"content":"","children":[{"content":"&#x26a0;&#xfe0f; Face recognition tracking in public.[cite: 2]","children":[],"payload":{"tag":"li","lines":"131,132"}},{"content":"&#x26a0;&#xfe0f; Mass collection of online behavior data.[cite: 2]","children":[],"payload":{"tag":"li","lines":"132,134"}}],"payload":{"tag":"ul","lines":"131,134"}},{"content":"","children":[{"content":"&#x1f535; Explainable AI (XAI): Humans can understand the AI&apos;s logic.[cite: 2]","children":[],"payload":{"tag":"li","lines":"135,136"}},{"content":"&#x26a0;&#xfe0f; Responsibility: Who answers when AI is wrong? (Developer, User, Operator?).[cite: 2]","children":[],"payload":{"tag":"li","lines":"136,138"}}],"payload":{"tag":"ul","lines":"135,138"}},{"content":"","children":[{"content":"&#x2b50; Fairness: No discrimination.[cite: 2]","children":[],"payload":{"tag":"li","lines":"139,140"}},{"content":"&#x2b50; Transparency: Show how decisions are made.[cite: 2]","children":[],"payload":{"tag":"li","lines":"140,141"}},{"content":"&#x2b50; Privacy Protection: Handle data safely.[cite: 2]","children":[],"payload":{"tag":"li","lines":"141,142"}},{"content":"&#x2b50; Accountability: Someone must be answerable.[cite: 2]","children":[],"payload":{"tag":"li","lines":"142,144"}}],"payload":{"tag":"ul","lines":"139,144"}}],"payload":{"tag":"h2","lines":"120,121"}},{"content":"9. EXAM-FOCUSED SECTION (&#x642;&#x633;&#x645; &#x627;&#x644;&#x62a;&#x631;&#x643;&#x64a;&#x632; &#x639;&#x644;&#x649; &#x627;&#x644;&#x627;&#x645;&#x62a;&#x62d;&#x627;&#x646;)","children":[{"content":"Algorithmic bias comes from the <strong>training data</strong>, not the computer&apos;s speed.[cite: 2]","children":[],"payload":{"tag":"li","lines":"149,150"}},{"content":"The 4 principles are <strong>Fairness</strong>, <strong>Transparency</strong>, <strong>Privacy protection</strong>, and <strong>Accountability</strong>.[cite: 2]","children":[],"payload":{"tag":"li","lines":"150,151"}},{"content":"<strong>XAI</strong> solves the &quot;black box&quot; problem by making the AI&apos;s logic understandable to humans.[cite: 2]","children":[],"payload":{"tag":"li","lines":"151,153"}}],"payload":{"tag":"h2","lines":"146,147"}},{"content":"10. QUESTIONS FOR SELF-ASSESSMENT (&#x623;&#x633;&#x626;&#x644;&#x629; &#x644;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x630;&#x627;&#x62a;&#x64a;)","children":[],"payload":{"tag":"h2","lines":"155,156"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
