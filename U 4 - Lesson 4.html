 &#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645;&#x64a; &#x643;&#x637;&#x631;&#x642; &#x644;&#x62a;&#x62d;&#x633;&#x64a;&#x646; &#x645;&#x648;&#x642;&#x639; &#x627;&#x644;&#x648;&#x64a;&#x628;.","children":[],"payload":{"tag":"li","lines":"27,29"}},{"content":"<strong>Describe</strong> how A/B testing compares two options using real data, and explain why improvement is repeated in cycles.[cite: 2]<br>\n<strong>&#x648;&#x635;&#x641;</strong> &#x643;&#x64a;&#x641; &#x64a;&#x642;&#x627;&#x631;&#x646; &#x627;&#x62e;&#x62a;&#x628;&#x627;&#x631; A/B &#x628;&#x64a;&#x646; &#x62e;&#x64a;&#x627;&#x631;&#x64a;&#x646; &#x628;&#x627;&#x633;&#x62a;&#x62e;&#x62f;&#x627;&#x645; &#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x62d;&#x642;&#x64a;&#x642;&#x64a;&#x629;&#x60c; &#x648;&#x634;&#x631;&#x62d; &#x633;&#x628;&#x628; &#x62a;&#x643;&#x631;&#x627;&#x631; &#x627;&#x644;&#x62a;&#x62d;&#x633;&#x64a;&#x646; &#x641;&#x64a; &#x62f;&#x648;&#x631;&#x627;&#x62a;.","children":[],"payload":{"tag":"li","lines":"29,32"}}],"payload":{"tag":"h2","lines":"22,23"}},{"content":"3. KEY VOCABULARY (&#x627;&#x644;&#x645;&#x635;&#x637;&#x644;&#x62d;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629;)","children":[{"content":"<table data-lines=\"36,43\">\n<thead data-lines=\"36,37\">\n<tr data-lines=\"36,37\">\n<th style=\"text-align:left\">English Term</th>\n<th style=\"text-align:left\">Simple English Meaning</th>\n<th style=\"text-align:left\">Arabic Meaning</th>\n<th style=\"text-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"38,43\">\n<tr data-lines=\"38,39\">\n<td style=\"text-align:left\"><strong>PDCA cycle</strong></td>\n<td style=\"text-align:left\">Plan, Do, Check, Act loop.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62f;&#x648;&#x631;&#x629; &#x62e;&#x637;&#x637;&#x60c; &#x646;&#x641;&#x630;&#x60c; &#x627;&#x641;&#x62d;&#x635;&#x60c; &#x62a;&#x635;&#x631;&#x641;</td>\n<td style=\"text-align:left\">A 4-step circle to keep making things better.[cite: 2]</td>\n</tr>\n<tr data-lines=\"39,40\">\n<td style=\"text-align:left\"><strong>Continuous improvement</strong></td>\n<td style=\"text-align:left\">Getting better a little at a time.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x62d;&#x633;&#x64a;&#x646; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x645;&#x631;</td>\n<td style=\"text-align:left\">Never stopping the upgrades.[cite: 2]</td>\n</tr>\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>Design thinking</strong></td>\n<td style=\"text-align:left\">Solving from the user&apos;s view in 5 steps.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x62a;&#x641;&#x643;&#x64a;&#x631; &#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645;&#x64a;</td>\n<td style=\"text-align:left\">Figuring out what the user actually needs.[cite: 2]</td>\n</tr>\n<tr data-lines=\"41,42\">\n<td style=\"text-align:left\"><strong>Prototype</strong></td>\n<td style=\"text-align:left\">A quick, testable draft.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x646;&#x645;&#x648;&#x630;&#x62c; &#x627;&#x644;&#x623;&#x648;&#x644;&#x64a;</td>\n<td style=\"text-align:left\">A quick rough version to test ideas.[cite: 2]</td>\n</tr>\n<tr data-lines=\"42,43\">\n<td style=\"text-align:left\"><strong>A/B testing</strong></td>\n<td style=\"text-align:left\">Compare two options with real data.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x62e;&#x62a;&#x628;&#x627;&#x631; &#x623;/&#x628;</td>\n<td style=\"text-align:left\">Showing half the users a red button and half a blue button to see which wins.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"36,43"}}],"payload":{"tag":"h2","lines":"34,35"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: The PDCA Cycle (&#x62f;&#x648;&#x631;&#x629; PDCA)","children":[{"content":"1. <strong>Plan (&#x62e;&#x637;&#x637;):</strong> Set goals and create a plan (e.g., set a goal to reduce bounce rate).[cite: 2]<br>\n&#x62d;&#x62f;&#x62f; &#x627;&#x644;&#x623;&#x647;&#x62f;&#x627;&#x641; &#x648;&#x636;&#x639; &#x62e;&#x637;&#x629; (&#x645;&#x62b;&#x644;: &#x62a;&#x62d;&#x62f;&#x64a;&#x62f; &#x647;&#x62f;&#x641; &#x644;&#x62a;&#x642;&#x644;&#x64a;&#x644; &#x645;&#x639;&#x62f;&#x644; &#x627;&#x644;&#x627;&#x631;&#x62a;&#x62f;&#x627;&#x62f;).","children":[],"payload":{"tag":"li","lines":"51,53","listIndex":1}},{"content":"2. <strong>Do (&#x646;&#x641;&#x630;):</strong> Execute according to the plan (e.g., change the design).[cite: 2]<br>\n&#x627;&#x644;&#x62a;&#x646;&#x641;&#x64a;&#x630; &#x648;&#x641;&#x642;&#x627;&#x64b; &#x644;&#x644;&#x62e;&#x637;&#x629; (&#x645;&#x62b;&#x644;: &#x62a;&#x63a;&#x64a;&#x64a;&#x631; &#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645;).","children":[],"payload":{"tag":"li","lines":"53,55","listIndex":2}},{"content":"3. <strong>Check (&#x627;&#x641;&#x62d;&#x635;):</strong> Measure results and evaluate goal achievement.[cite: 2]<br>\n&#x642;&#x64a;&#x627;&#x633; &#x627;&#x644;&#x646;&#x62a;&#x627;&#x626;&#x62c; &#x648;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x645;&#x62f;&#x649; &#x62a;&#x62d;&#x642;&#x64a;&#x642; &#x627;&#x644;&#x647;&#x62f;&#x641;.","children":[],"payload":{"tag":"li","lines":"55,57","listIndex":3}},{"content":"4. <strong>Act (&#x62a;&#x635;&#x631;&#x641;):</strong> Consider the next improvement measures based on evaluation.[cite: 2]<br>\n&#x627;&#x644;&#x646;&#x638;&#x631; &#x641;&#x64a; &#x62a;&#x62f;&#x627;&#x628;&#x64a;&#x631; &#x627;&#x644;&#x62a;&#x62d;&#x633;&#x64a;&#x646; &#x627;&#x644;&#x62a;&#x627;&#x644;&#x64a;&#x629; &#x628;&#x646;&#x627;&#x621;&#x64b; &#x639;&#x644;&#x649; &#x627;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645;.","children":[],"payload":{"tag":"li","lines":"57,60","listIndex":4}}],"payload":{"tag":"h3","lines":"48,49"}},{"content":"Main Topic 2: Design Thinking (&#x627;&#x644;&#x62a;&#x641;&#x643;&#x64a;&#x631; &#x627;&#x644;&#x62a;&#x635;&#x645;&#x64a;&#x645;&#x64a;)","children":[{"content":"1. <strong>Empathize (&#x627;&#x644;&#x62a;&#x639;&#x627;&#x637;&#x641;):</strong> Understand the user&apos;s challenges.[cite: 2] (&#x641;&#x647;&#x645; &#x62a;&#x62d;&#x62f;&#x64a;&#x627;&#x62a; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;).","children":[],"payload":{"tag":"li","lines":"66,67","listIndex":1}},{"content":"2. <strong>Define (&#x627;&#x644;&#x62a;&#x639;&#x631;&#x64a;&#x641;):</strong> Clarify the problem.[cite: 2] (&#x62a;&#x648;&#x636;&#x64a;&#x62d; &#x627;&#x644;&#x645;&#x634;&#x643;&#x644;&#x629;).","children":[],"payload":{"tag":"li","lines":"67,68","listIndex":2}},{"content":"3. <strong>Ideate (&#x627;&#x628;&#x62a;&#x643;&#x627;&#x631; &#x627;&#x644;&#x623;&#x641;&#x643;&#x627;&#x631;):</strong> Generate many ideas.[cite: 2] (&#x62a;&#x648;&#x644;&#x64a;&#x62f; &#x627;&#x644;&#x639;&#x62f;&#x64a;&#x62f; &#x645;&#x646; &#x627;&#x644;&#x623;&#x641;&#x643;&#x627;&#x631;).","children":[],"payload":{"tag":"li","lines":"68,69","listIndex":3}},{"content":"4. <strong>Prototype (&#x627;&#x644;&#x646;&#x645;&#x648;&#x630;&#x62c; &#x627;&#x644;&#x623;&#x648;&#x644;&#x64a;):</strong> Quickly create a prototype.[cite: 2] (&#x625;&#x646;&#x634;&#x627;&#x621; &#x646;&#x645;&#x648;&#x630;&#x62c; &#x623;&#x648;&#x644;&#x64a; &#x628;&#x633;&#x631;&#x639;&#x629;).","children":[],"payload":{"tag":"li","lines":"69,70","listIndex":4}},{"content":"5. <strong>Test (&#x627;&#x644;&#x627;&#x62e;&#x62a;&#x628;&#x627;&#x631;):</strong> Have users try it and get feedback.[cite: 2] (&#x62c;&#x639;&#x644; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;&#x64a;&#x646; &#x64a;&#x62c;&#x631;&#x628;&#x648;&#x646;&#x647; &#x648;&#x623;&#x62e;&#x630; &#x622;&#x631;&#x627;&#x626;&#x647;&#x645;).","children":[],"payload":{"tag":"li","lines":"70,72","listIndex":5}}],"payload":{"tag":"h3","lines":"63,64"}},{"content":"Main Topic 3: A/B Testing (&#x627;&#x62e;&#x62a;&#x628;&#x627;&#x631; &#x623;/&#x628;)","children":[{"content":"Change only <strong>one element</strong> at a time.[cite: 2] (&#x63a;&#x64a;&#x651;&#x631; &#x639;&#x646;&#x635;&#x631;&#x627;&#x64b; &#x648;&#x627;&#x62d;&#x62f;&#x627;&#x64b; &#x641;&#x642;&#x637; &#x641;&#x64a; &#x643;&#x644; &#x645;&#x631;&#x629;).","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"Make decisions only after collecting a sufficient amount of data.[cite: 2] (&#x627;&#x62a;&#x62e;&#x630; &#x627;&#x644;&#x642;&#x631;&#x627;&#x631;&#x627;&#x62a; &#x641;&#x642;&#x637; &#x628;&#x639;&#x62f; &#x62c;&#x645;&#x639; &#x643;&#x645;&#x64a;&#x629; &#x643;&#x627;&#x641;&#x64a;&#x629; &#x645;&#x646; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;).","children":[],"payload":{"tag":"li","lines":"80,82"}}],"payload":{"tag":"h3","lines":"75,76"}}],"payload":{"tag":"h2","lines":"46,47"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: Why change only ONE element in A/B testing?[cite: 2]","children":[],"payload":{"tag":"h3","lines":"86,87"}}],"payload":{"tag":"h2","lines":"84,85"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"95,101\">\n<thead data-lines=\"95,96\">\n<tr data-lines=\"95,96\">\n<th style=\"text-align:left\">Step in PDCA</th>\n<th style=\"text-align:left\">Action (&#x627;&#x644;&#x625;&#x62c;&#x631;&#x627;&#x621;)[cite: 2]</th>\n<th style=\"text-align:left\">Example (&#x645;&#x62b;&#x627;&#x644;)[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"97,101\">\n<tr data-lines=\"97,98\">\n<td style=\"text-align:left\"><strong>Plan</strong></td>\n<td style=\"text-align:left\">Set a goal.</td>\n<td style=\"text-align:left\">&quot;I want to reduce bounce rate by 10%.&quot;</td>\n</tr>\n<tr data-lines=\"98,99\">\n<td style=\"text-align:left\"><strong>Do</strong></td>\n<td style=\"text-align:left\">Make the change.</td>\n<td style=\"text-align:left\">Change the website&apos;s heading text.</td>\n</tr>\n<tr data-lines=\"99,100\">\n<td style=\"text-align:left\"><strong>Check</strong></td>\n<td style=\"text-align:left\">Measure data.</td>\n<td style=\"text-align:left\">Look at the new bounce rate numbers.</td>\n</tr>\n<tr data-lines=\"100,101\">\n<td style=\"text-align:left\"><strong>Act</strong></td>\n<td style=\"text-align:left\">Decide next step.</td>\n<td style=\"text-align:left\">If it worked, keep it. If not, try a new picture next time.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"95,101"}}],"payload":{"tag":"h2","lines":"93,94"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image:</strong> A circular diagram showing 4 arrows forming a continuous loop, labeled P, D, C, A with &quot;Continuous Improvement&quot; in the center.[cite: 2]","children":[{"content":"<em>Search Keywords:</em> &quot;PDCA cycle continuous improvement loop&quot;","children":[],"payload":{"tag":"li","lines":"107,109"}}],"payload":{"tag":"li","lines":"106,109"}}],"payload":{"tag":"h2","lines":"104,105"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f535; Plan: Set goal &amp; plan change.[cite: 2]","children":[],"payload":{"tag":"li","lines":"117,118"}},{"content":"&#x1f535; Do: Execute the change.[cite: 2]","children":[],"payload":{"tag":"li","lines":"118,119"}},{"content":"&#x1f535; Check: Measure results.[cite: 2]","children":[],"payload":{"tag":"li","lines":"119,120"}},{"content":"&#x1f535; Act: Decide next steps.[cite: 2]","children":[],"payload":{"tag":"li","lines":"120,121"}},{"content":"&#x2b50; Concept: Continuous looping.[cite: 2]","children":[],"payload":{"tag":"li","lines":"121,123"}}],"payload":{"tag":"ul","lines":"117,123"}},{"content":"","children":[{"content":"&#x1f7e2; 1. Empathize: Understand user.[cite: 2]","children":[],"payload":{"tag":"li","lines":"124,125"}},{"content":"&#x1f7e2; 2. Define: Clarify problem.[cite: 2]","children":[],"payload":{"tag":"li","lines":"125,126"}},{"content":"&#x1f7e2; 3. Ideate: Brainstorm ideas.[cite: 2]","children":[],"payload":{"tag":"li","lines":"126,127"}},{"content":"&#x1f7e2; 4. Prototype: Build quick draft.[cite: 2]","children":[],"payload":{"tag":"li","lines":"127,128"}},{"content":"&#x1f7e2; 5. Test: Get user feedback.[cite: 2]","children":[],"payload":{"tag":"li","lines":"128,130"}}],"payload":{"tag":"ul","lines":"124,130"}},{"content":"","children":[{"content":"&#x26a0;&#xfe0f; Rule 1: Change ONLY ONE element.[cite: 2]","children":[],"payload":{"tag":"li","lines":"131,132"}},{"content":"&#x26a0;&#xfe0f; Rule 2: Wait for enough data.[cite: 2]","children":[],"payload":{"tag":"li","lines":"132,134"}}],"payload":{"tag":"ul","lines":"131,134"}}],"payload":{"tag":"h2","lines":"111,112"}},{"content":"9. EXAM-FOCUSED SECTION (&#x642;&#x633;&#x645; &#x627;&#x644;&#x62a;&#x631;&#x643;&#x64a;&#x632; &#x639;&#x644;&#x649; &#x627;&#x644;&#x627;&#x645;&#x62a;&#x62d;&#x627;&#x646;)","children":[{"content":"Measuring the bounce rate <em>after</em> making a change belongs to the <strong>Check</strong> phase of PDCA.[cite: 2]","children":[],"payload":{"tag":"li","lines":"139,140"}},{"content":"The <strong>Empathize</strong> step in Design Thinking involves putting yourself in the user&apos;s position to understand their challenges.[cite: 2]","children":[],"payload":{"tag":"li","lines":"140,141"}},{"content":"In <strong>A/B Testing</strong>, you must change exactly ONE element at a time; otherwise, you cannot prove which change caused the
