7; &#x627;&#x644;&#x62b;&#x644;&#x627;&#x62b;: &#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x623;&#x645;&#x627;&#x645;&#x64a;&#x629;&#x60c; &#x648;&#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629;&#x60c; &#x648;&#x642;&#x627;&#x639;&#x62f;&#x629; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;.","children":[],"payload":{"tag":"li","lines":"25,27"}},{"content":"<strong>Trace</strong> how the three tiers cooperate to turn a user&apos;s action into a result, using familiar services as examples.[cite: 2]<br>\n<strong>&#x62a;&#x62a;&#x628;&#x639;</strong> &#x643;&#x64a;&#x641; &#x62a;&#x62a;&#x639;&#x627;&#x648;&#x646; &#x627;&#x644;&#x637;&#x628;&#x642;&#x627;&#x62a; &#x627;&#x644;&#x62b;&#x644;&#x627;&#x62b; &#x644;&#x62a;&#x62d;&#x648;&#x64a;&#x644; &#x625;&#x62c;&#x631;&#x627;&#x621; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645; &#x625;&#x644;&#x649; &#x646;&#x62a;&#x64a;&#x62c;&#x629;&#x60c; &#x628;&#x627;&#x633;&#x62a;&#x62e;&#x62f;&#x627;&#x645; &#x62e;&#x62f;&#x645;&#x627;&#x62a; &#x645;&#x623;&#x644;&#x648;&#x641;&#x629; &#x643;&#x623;&#x645;&#x62b;&#x644;&#x629;.","children":[],"payload":{"tag":"li","lines":"27,30"}}],"payload":{"tag":"h2","lines":"20,21"}},{"content":"3. KEY VOCABULARY (&#x627;&#x644;&#x645;&#x635;&#x637;&#x644;&#x62d;&#x627;&#x62a; &#x627;&#x644;&#x623;&#x633;&#x627;&#x633;&#x64a;&#x629;)","children":[{"content":"<table data-lines=\"34,41\">\n<thead data-lines=\"34,35\">\n<tr data-lines=\"34,35\">\n<th style=\"text-align:left\">English Term</th>\n<th style=\"text-align:left\">Simple English Meaning</th>\n<th style=\"text-align:left\">Arabic Meaning</th>\n<th style=\"text-align:left\">Easy Explanation</th>\n</tr>\n</thead>\n<tbody data-lines=\"36,41\">\n<tr data-lines=\"36,37\">\n<td style=\"text-align:left\"><strong>Web application</strong></td>\n<td style=\"text-align:left\">An application used through a web browser with no installation.[cite: 2]</td>\n<td style=\"text-align:left\">&#x62a;&#x637;&#x628;&#x64a;&#x642; &#x627;&#x644;&#x648;&#x64a;&#x628;</td>\n<td style=\"text-align:left\">An app you use on the internet without downloading it.[cite: 2]</td>\n</tr>\n<tr data-lines=\"37,38\">\n<td style=\"text-align:left\"><strong>Frontend</strong></td>\n<td style=\"text-align:left\">The screen users see and interact with.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x623;&#x645;&#x627;&#x645;&#x64a;&#x629;</td>\n<td style=\"text-align:left\">The part of the website you can click and look at.[cite: 2]</td>\n</tr>\n<tr data-lines=\"38,39\">\n<td style=\"text-align:left\"><strong>Backend</strong></td>\n<td style=\"text-align:left\">The hidden server-side processing.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629;</td>\n<td style=\"text-align:left\">The invisible brain that processes your requests.[cite: 2]</td>\n</tr>\n<tr data-lines=\"39,40\">\n<td style=\"text-align:left\"><strong>Database</strong></td>\n<td style=\"text-align:left\">Where data is stored and managed.[cite: 2]</td>\n<td style=\"text-align:left\">&#x642;&#x627;&#x639;&#x62f;&#x629; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;</td>\n<td style=\"text-align:left\">The digital filing cabinet that saves all the information.[cite: 2]</td>\n</tr>\n<tr data-lines=\"40,41\">\n<td style=\"text-align:left\"><strong>Three-tier architecture</strong></td>\n<td style=\"text-align:left\">Frontend + backend + database cooperating.[cite: 2]</td>\n<td style=\"text-align:left\">&#x627;&#x644;&#x628;&#x646;&#x64a;&#x629; &#x62b;&#x644;&#x627;&#x62b;&#x64a;&#x629; &#x627;&#x644;&#x637;&#x628;&#x642;&#x627;&#x62a;</td>\n<td style=\"text-align:left\">The 3-part system that makes modern websites work.[cite: 2]</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"34,41"}}],"payload":{"tag":"h2","lines":"32,33"}},{"content":"4. BILINGUAL SENTENCE-BY-SENTENCE EXPLANATION (&#x627;&#x644;&#x634;&#x631;&#x62d; &#x627;&#x644;&#x62a;&#x641;&#x635;&#x64a;&#x644;&#x64a;)","children":[{"content":"Main Topic 1: What is a Web Application? (&#x645;&#x627; &#x647;&#x648; &#x62a;&#x637;&#x628;&#x64a;&#x642; &#x627;&#x644;&#x648;&#x64a;&#x628;&#x61f;)","children":[],"payload":{"tag":"h3","lines":"46,47"}},{"content":"Main Topic 2: The Three Tiers (&#x627;&#x644;&#x637;&#x628;&#x642;&#x627;&#x62a; &#x627;&#x644;&#x62b;&#x644;&#x627;&#x62b;)","children":[{"content":"1. <strong>Frontend (&#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x623;&#x645;&#x627;&#x645;&#x64a;&#x629;):</strong> The screen component that users see directly. It runs on the browser and accepts user input (e.g., Search screen, input forms).[cite: 2]<br>\n&#x645;&#x643;&#x648;&#x646; &#x627;&#x644;&#x634;&#x627;&#x634;&#x629; &#x627;&#x644;&#x630;&#x64a; &#x64a;&#x631;&#x627;&#x647; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;&#x648;&#x646; &#x645;&#x628;&#x627;&#x634;&#x631;&#x629;. &#x64a;&#x639;&#x645;&#x644; &#x639;&#x644;&#x649; &#x627;&#x644;&#x645;&#x62a;&#x635;&#x641;&#x62d; &#x648;&#x64a;&#x642;&#x628;&#x644; &#x625;&#x62f;&#x62e;&#x627;&#x644; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645; (&#x645;&#x62b;&#x644;: &#x634;&#x627;&#x634;&#x629; &#x627;&#x644;&#x628;&#x62d;&#x62b;&#x60c; &#x646;&#x645;&#x627;&#x630;&#x62c; &#x627;&#x644;&#x625;&#x62f;&#x62e;&#x627;&#x644;).","children":[],"payload":{"tag":"li","lines":"57,59","listIndex":1}},{"content":"2. <strong>Backend (&#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629;):</strong> The server-side processing that users do not see. It processes data and makes decisions (e.g., login authentication).[cite: 2]<br>\n&#x627;&#x644;&#x645;&#x639;&#x627;&#x644;&#x62c;&#x629; &#x639;&#x644;&#x649; &#x62c;&#x627;&#x646;&#x628; &#x627;&#x644;&#x62e;&#x627;&#x62f;&#x645; &#x627;&#x644;&#x62a;&#x64a; &#x644;&#x627; &#x64a;&#x631;&#x627;&#x647;&#x627; &#x627;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;&#x648;&#x646;. &#x62a;&#x642;&#x648;&#x645; &#x628;&#x645;&#x639;&#x627;&#x644;&#x62c;&#x629; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x648;&#x627;&#x62a;&#x62e;&#x627;&#x630; &#x627;&#x644;&#x642;&#x631;&#x627;&#x631;&#x627;&#x62a; (&#x645;&#x62b;&#x644;: &#x645;&#x635;&#x627;&#x62f;&#x642;&#x629; &#x62a;&#x633;&#x62c;&#x64a;&#x644; &#x627;&#x644;&#x62f;&#x62e;&#x648;&#x644;).","children":[],"payload":{"tag":"li","lines":"59,61","listIndex":2}},{"content":"3. <strong>Database (&#x642;&#x627;&#x639;&#x62f;&#x629; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;):</strong> A system that organizes, stores, and manages data. It retrieves data when needed and records new data.[cite: 2]<br>\n&#x646;&#x638;&#x627;&#x645; &#x64a;&#x646;&#x638;&#x645; &#x648;&#x64a;&#x62e;&#x632;&#x646; &#x648;&#x64a;&#x62f;&#x64a;&#x631; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;. &#x64a;&#x642;&#x648;&#x645; &#x628;&#x627;&#x633;&#x62a;&#x631;&#x62f;&#x627;&#x62f; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x639;&#x646;&#x62f; &#x627;&#x644;&#x62d;&#x627;&#x62c;&#x629; &#x648;&#x62a;&#x633;&#x62c;&#x64a;&#x644; &#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x62c;&#x62f;&#x64a;&#x62f;&#x629;.","children":[],"payload":{"tag":"li","lines":"61,64","listIndex":3}}],"payload":{"tag":"h3","lines":"54,55"}},{"content":"Main Topic 3: The Flow of Cooperation (&#x645;&#x633;&#x627;&#x631; &#x627;&#x644;&#x62a;&#x639;&#x627;&#x648;&#x646;)","children":[{"content":"1. The <strong>frontend</strong> receives the search keywords entered by the user.[cite: 2] (&#x62a;&#x62a;&#x644;&#x642;&#x649; &#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x623;&#x645;&#x627;&#x645;&#x64a;&#x629; &#x643;&#x644;&#x645;&#x627;&#x62a; &#x627;&#x644;&#x628;&#x62d;&#x62b;).","children":[],"payload":{"tag":"li","lines":"69,70","listIndex":1}},{"content":"2. The <strong>frontend</strong> sends the search keywords to the backend.[cite: 2] (&#x62a;&#x631;&#x633;&#x644; &#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x623;&#x645;&#x627;&#x645;&#x64a;&#x629; &#x627;&#x644;&#x643;&#x644;&#x645;&#x627;&#x62a; &#x644;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629;).","children":[],"payload":{"tag":"li","lines":"70,71","listIndex":2}},{"content":"3. The <strong>backend</strong> searches the database for matching products.[cite: 2] (&#x62a;&#x628;&#x62d;&#x62b; &#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629; &#x641;&#x64a; &#x642;&#x627;&#x639;&#x62f;&#x629; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a;).","children":[],"payload":{"tag":"li","lines":"71,72","listIndex":3}},{"content":"4. The <strong>database</strong> returns the data of matching products to the backend.[cite: 2] (&#x62a;&#x64f;&#x631;&#x62c;&#x639; &#x642;&#x627;&#x639;&#x62f;&#x629; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x627;&#x644;&#x628;&#x64a;&#x627;&#x646;&#x627;&#x62a; &#x644;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629;).","children":[],"payload":{"tag":"li","lines":"72,73","listIndex":4}},{"content":"5. The <strong>backend</strong> organizes the search results and returns them to the frontend.[cite: 2] (&#x62a;&#x646;&#x638;&#x645; &#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x62e;&#x644;&#x641;&#x64a;&#x629; &#x627;&#x644;&#x646;&#x62a;&#x627;&#x626;&#x62c; &#x648;&#x62a;&#x631;&#x62c;&#x639;&#x647;&#x627;).","children":[],"payload":{"tag":"li","lines":"73,74","listIndex":5}},{"content":"6. The <strong>frontend</strong> displays the search results on the user&apos;s screen.[cite: 2] (&#x62a;&#x639;&#x631;&#x636; &#x627;&#x644;&#x648;&#x627;&#x62c;&#x647;&#x629; &#x627;&#x644;&#x623;&#x645;&#x627;&#x645;&#x64a;&#x629; &#x627;&#x644;&#x646;&#x62a;&#x627;&#x626;&#x62c; &#x644;&#x644;&#x645;&#x633;&#x62a;&#x62e;&#x62f;&#x645;).","children":[],"payload":{"tag":"li","lines":"74,76","listIndex":6}}],"payload":{"tag":"h3","lines":"64,65"}}],"payload":{"tag":"h2","lines":"44,45"}},{"content":"5. SIMPLIFY DIFFICULT CONCEPTS (&#x62a;&#x628;&#x633;&#x64a;&#x637; &#x627;&#x644;&#x645;&#x641;&#x627;&#x647;&#x64a;&#x645; &#x627;&#x644;&#x635;&#x639;&#x628;&#x629;)","children":[{"content":"Difficult Concept: Three-Tier Architecture (&#x627;&#x644;&#x628;&#x646;&#x64a;&#x629; &#x62b;&#x644;&#x627;&#x62b;&#x64a;&#x629; &#x627;&#x644;&#x637;&#x628;&#x642;&#x627;&#x62a;)[cite: 2]","children":[],"payload":{"tag":"h3","lines":"80,81"}}],"payload":{"tag":"h2","lines":"78,79"}},{"content":"6. COMPARISONS (&#x627;&#x644;&#x645;&#x642;&#x627;&#x631;&#x646;&#x627;&#x62a;)","children":[{"content":"<table data-lines=\"92,97\">\n<thead data-lines=\"92,93\">\n<tr data-lines=\"92,93\">\n<th style=\"text-align:left\">Tier (&#x627;&#x644;&#x637;&#x628;&#x642;&#x629;)[cite: 2]</th>\n<th style=\"text-align:left\">Role (&#x627;&#x644;&#x62f;&#x648;&#x631;)[cite: 2]</th>\n<th style=\"text-align:left\">Example in SNS (&#x645;&#x62b;&#x627;&#x644; &#x641;&#x64a; &#x648;&#x633;&#x627;&#x626;&#x644; &#x627;&#x644;&#x62a;&#x648;&#x627;&#x635;&#x644;)[cite: 2]</th>\n</tr>\n</thead>\n<tbody data-lines=\"94,97\">\n<tr data-lines=\"94,95\">\n<td style=\"text-align:left\"><strong>Frontend</strong></td>\n<td style=\"text-align:left\">Display &amp; Operation</td>\n<td style=\"text-align:left\">Timeline screen, Post screens.</td>\n</tr>\n<tr data-lines=\"95,96\">\n<td style=\"text-align:left\"><strong>Backend</strong></td>\n<td style=\"text-align:left\">Processing &amp; Control</td>\n<td style=\"text-align:left\">Determining audience, sending notifications.</td>\n</tr>\n<tr data-lines=\"96,97\">\n<td style=\"text-align:left\"><strong>Database</strong></td>\n<td style=\"text-align:left\">Storage &amp; Management</td>\n<td style=\"text-align:left\">Storing post data and follow relationships.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"92,97"}}],"payload":{"tag":"h2","lines":"90,91"}},{"content":"7. VISUAL LEARNING &amp; IMAGE SUGGESTIONS (&#x627;&#x644;&#x62a;&#x639;&#x644;&#x645; &#x627;&#x644;&#x628;&#x635;&#x631;&#x64a;)","children":[{"content":"<strong>Suggested Image:</strong> A diagram showing a User connected to a Browser (Frontend), which sends a Request to a Server (Backend), which sends a Query to a Database (Storage).[cite: 2]","children":[{"content":"<em>Search Keywords:</em> &quot;Three-tier web application architecture diagram frontend backend database&quot;","children":[],"payload":{"tag":"li","lines":"103,105"}}],"payload":{"tag":"li","lines":"102,105"}}],"payload":{"tag":"h2","lines":"100,101"}},{"content":"8. DETAILED MIND MAP BLUEPRINT (&#x645;&#x62e;&#x637;&#x637; &#x627;&#x644;&#x62e;&#x631;&#x64a;&#x637;&#x629; &#x627;&#x644;&#x630;&#x647;&#x646;&#x64a;&#x629;)","children":[{"content":"","children":[{"content":"&#x1f535; Role: Display and operation.[cite: 2]","children":[],"payload":{"tag":"li","lines":"113,114"}},{"content":"&#x1f7e2; Examples: Search box, product lists, screens.[cite: 2]","children":[],"payload":{"tag":"li","lines":"114,116"}}],"payload":{"tag":"ul","lines":"113,116"}},{"content":"","children":[{"content":"&#x1f535; Role: Processing and control (Hidden).[cite: 2]","children":[],"payload":{"tag":"li","lines":"117,118"}},{"content":"&#x1f7e2; Examples: Authentication, stock checking.[cite: 2]","children":[],"payload":{"tag":"li","lines":"118,120"}}],"payload":{"tag":"ul","lines":"117,120"}},{"content":"","children":[{"content":"&#x1f535; Role: Storage and management.[cite: 2]","children":[],"payload":{"tag":"li","lines":"121,122"}},{"content":"&#x1f7e2; Examples: Saving user info, order history.[cite: 2]","children":[],"payload":{"tag":"li","lines":"122,124"}}],"payload":{"tag":"ul","lines":"121,124"}},{"content":"&#x2b50; User types -&gt; Frontend -&gt; Backend -&gt; Database -&gt; Backend -&gt; Frontend -&gt; User sees results.[cite: 2]","children":[],"payload":{"tag":"li","lines":"125,127"}}],"payload":{"tag":"h2","lines":"107,108"}},{"content":"9. EXAM-FOCUSED SECTION (&#x642;&#x633;&#x645; &#x627;&#x644;&#x62a;&#x631;&#x643;&#x64a;&#x632; &#x639;&#x644;&#x649; &#x627;&#x644;&#x627;&#x645;&#x62a;&#x62d;&#x627;&#x646;)","children":[{"content":"A web application does <strong>NOT</strong> require installing dedicated software; it works in a browser.[cite: 2]","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"The <strong>backend</strong> runs on the server, NOT on the browser.[cite: 2]","children":[],"payload":{"tag":"li","lines":"133,134"}},{"content":"The <strong>frontend</strong> is the only part the user directly interacts with.[cite: 2]","children":[],"payload":{"tag":"li","lines":"134,136"}}],"payload":{"tag":"h2","lines":"129,130"}},{"content":"10. QUESTIONS FOR SELF-ASSESSMENT (&#x623;&#x633;&#x626;&#x644;&#x629; &#x644;&#x644;&#x62a;&#x642;&#x64a;&#x64a;&#x645; &#x627;&#x644;&#x630;&#x627;&#x62a;&#x64a;)","children":[],"payload":{"tag":"h2","lines":"138,139"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
